ents' earlier average", "catch": "This was not a randomized trial: students chose when to start, and they reported their own start dates. It is an unreviewed working paper from one county, about general chatbots rather than tutoring tools.", "takeaway": "In this study, students who used chatbots freely got better homework grades but lower exam scores.", "topic": "ChatGPT & learning", "source": {"citation": "Strömberg, Lei & Wu, 2026", "url": "https://cepr.org/publications/dp21577", "page": "p. 3"}, "country": "China", "year": 2026, "id": "stromberg-china-2026", "guess": {"prompt": "After six months of chatbot homework help, what happened to exam scores?", "options": ["Exam scores went up", "No real change", "Exam scores went down"], "correct": 2}, "recall": {"prompt": "In the 30-month study of 26,811 Chinese secondary students using chatbots, what happened to homework vs. exams?", "options": ["Homework down, exam scores up", "Homework up 18%, monthly exams down 20%", "Both homework and exam scores rose"], "correct": 1, "explain": "After six months, homework scores rose 18%, but closed-book monthly exam scores fell 20% below students' earlier average."}, "kind": "A natural experiment, not randomized"}, {"hook": "What makes a smart speaker good at reading stories to young kids?", "answer": "Asking questions: with scripted questions and feedback, kids understood about as well as with an adult; narrating alone did worst.", "story": "In five US childcare centers, 117 children aged 3 to 6 heard one roughly 15-minute story, read by a Google Home Mini or an adult, with or without nine scripted questions and feedback. Questions raised story comprehension by 0.51 standard deviations, the authors say; with questions, the speaker was not clearly different from the adult.", "chart": {"type": "bars", "unit": "standardized comprehension score", "bars": [{"label": "Speaker, with questions", "value": 0.22}, {"label": "Speaker, narration only", "value": -0.39}, {"label": "Adult, with questions", "value": 0.26}, {"label": "Adult, narration only", "value": -0.12}]}, "caption": "Average story comprehension in each of the four groups (standardized units)", "catch": "One 15-minute session, tested right after on the same story with the researchers' own quiz. Kids had high vocabularies, groups were small, and the speaker followed a fixed script, not generative AI.", "takeaway": "In one short session, asking questions while reading helped preschoolers understand the story, whether a speaker or adult asked.", "topic": "Reading", "source": {"citation": "Xu, Aubele, Vigil, Bustamante, Kim, Warschauer, 2022", "url": "https://europepmc.org/articles/PMC9299009?pdf=render", "page": "p. 9"}, "country": "United States", "year": 2022, "id": "inicial-xu-2022", "guess": {"prompt": "What do you think made the speaker work best?", "options": ["Nothing: kids always understood less than with an adult", "A warm, human-sounding voice", "Asking kids questions while reading"], "correct": 2}, "recall": {"prompt": "In the US study where a Google Home Mini read stories to kids aged 3 to 6, which group understood the story worst?", "options": ["Adult narrating only", "Speaker asking questions", "Speaker narrating only"], "correct": 2, "explain": "The speaker narrating alone scored lowest (-0.39); with scripted questions it scored 0.22, close to the adult's 0.26."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "Why might students feel they learned less in the class where they learned more?", "answer": "Thinking hard in active classes felt like struggling, so students rated them lower even though they scored higher on the test.", "story": "149 Harvard students in introductory physics each had one 90-minute active class, where they solved problems in small groups, and one polished lecture with the same materials. On a 12-question test at the end of class, they scored almost half a standard deviation higher after the active class. Yet they reported feeling they had learned less.", "chart": {"type": "effect", "value": 0.46, "low": null, "high": null, "label": "End-of-class physics test score, active class vs. lecture"}, "caption": "Active class vs. lecture on the end-of-class test, in standard deviations", "catch": "Each student had just one class of each kind, and the 12-question test came right after class. It shows immediate learning, not what stuck. All participants were Harvard physics students.", "takeaway": "Feeling you learned a lot is not proof you did. The effortful active class taught more here.", "topic": "Learning science", "source": {"citation": "Deslauriers et al., 2019", "url": "https://doi.org/10.1073/pnas.1821936116", "page": "p. 3"}, "country": "United States", "year": 2019, "id": "sensacion-deslauriers-2019", "guess": {"prompt": "After the active class vs. the lecture, how did scores and feelings compare?", "options": ["Scored higher after lecture, and rated it higher", "Scored higher after active class, but rated it lower", "Scored the same, but preferred the lecture"], "correct": 1}, "recall": {"prompt": "In the Harvard physics trial of active class vs. polished lecture, how did the active class affect test scores?", "options": ["Almost half an SD lower than after the lecture", "Almost half an SD higher than after the lecture", "No real difference from the lecture"], "correct": 1, "explain": "Students scored 0.46 standard deviations higher after the active class, yet reported feeling they had learned less."}, "kind": "A rigorous randomized trial"}, {"hook": "What do brain scans of 1,011 people reveal about being \"left-brained\" or \"right-brained\"?", "answer": "No whole-brain \"left-brained\" or \"right-brained\" type showed up. Lopsidedness exists, but only in local brain networks.", "story": "Researchers pooled resting brain scans of 1,011 people aged 7 to 29 from public databases at 36 sites in the US, China, Europe and Australia. If left- or right-brained people existed, strong left-side networks should come with weaker right-side ones. Of 1,620 left-right connection pairs, only 1.2% showed that pattern; 1.0% showed the opposite.", "chart": {"type": "bars", "unit": "% of 1,620 left-right connection pairs", "bars": [{"label": "Opposite pattern (what the myth predicts)", "value": 1.2}, {"label": "Same pattern (against the myth)", "value": 1}]}, "caption": "Almost no connection pairs followed the seesaw pattern the left/right-brain idea requires", "catch": "Scans were taken at rest. No one's personality, creativity or school learning was measured, so the study doesn't link brain sides to how anyone learns.", "takeaway": "Brain scans don't support sorting people into \"left-brained\" and \"right-brained\" types.", "topic": "Myths", "source": {"citation": "Nielsen et al., 2013", "url": "https://doi.org/10.1371/journal.pone.0071275", "page": "p. 5"}, "country": "United States, China, United Kingdom, Germany, Netherlands, Finland, Australia", "year": 2013, "id": "mitos-hemisferios-nielsen-2013", "guess": {"prompt": "Did scans of 1,011 people reveal left-brained and right-brained types?", "options": ["Yes, people split into clear left/right types", "Yes, most people turned out left-brained", "No whole-brain type; lopsidedness was only local"], "correct": 2}, "recall": {"prompt": "In the 2013 brain-scan study of 1,011 people, how many left-right pairs showed the seesaw pattern the myth needs?", "options": ["About half of them", "Only 1.2% of them", "Nearly all of them"], "correct": 1, "explain": "Of 1,620 left-right pairs, only 1.2% showed the seesaw pattern, so no whole-brain left- or right-brained type appeared."}, "kind": "A brain-scan study of over a thousand people"}, {"hook": "What happened to test scores when Uruguay gave every primary student a laptop?", "answer": "In the first two years, no clear effect on math or reading scores showed up.", "story": "Researchers followed 2,080 public school students across Uruguay, tested in third grade in 2006 and again in 2009. Laptops arrived at different times, from days to almost two years before the second test. Students with longer exposure did not progress clearly more in math or reading than those with less.", "chart": {"type": "effect", "value": 0.0394, "low": -0.14, "high": 0.22, "label": "Math score change per year with a laptop, in standard deviations"}, "caption": "Math change per year with a laptop: close to zero; the likely range spans zero", "catch": "Not a randomized trial; a simpler model showed a gain that vanished after accounting for Montevideo getting laptops last. Exposure was under two years, and Ceibal helped fund it. Not AI.", "takeaway": "Handing out laptops alone did not clearly lift math or reading in the first two years.", "topic": "Policy", "source": {"citation": "de Melo, Machado & Miranda, 2014", "url": "https://docs.iza.org/dp8489.pdf", "page": "p. 16"}, "country": "Uruguay", "year": 2014, "id": "uruguay-ceibal-demelo-2014", "guess": {"prompt": "What happened to math and reading scores in the first two years?", "options": ["No clear effect on scores", "Scores clearly went up", "Scores clearly went down"], "correct": 0}, "recall": {"prompt": "In the Uruguay study of Plan Ceibal's laptop for every primary student, why did an early math gain disappear?", "options": ["Only rural schools were kept in the analysis", "Most laptops arrived after the 2009 test", "Accounting for Montevideo getting laptops last"], "correct": 2, "explain": "A simpler model showed a math gain of 0.16 standard deviations per year, but it fell to about 0.04 once Montevideo's late laptops were considered."}, "kind": "A natural experiment, not randomized"}, {"hook": "What happened when 7th and 8th graders in Sierra Leone learned math alongside Gemini?", "answer": "Their math scores rose by 0.258 standard deviations, but only once you account for the Gemini group starting lower.", "story": "In 48 classrooms across 12 public schools in Port Loko, Sierra Leone, students worked in pairs with Gemini's Guided Learning mode, which guides rather than gives answers, about 90 minutes a week for eight weeks. Other classes kept usual math lessons. Students already ahead gained more.", "chart": {"type": "effect", "value": 0.258, "low": 0.027, "high": 0.488, "label": "Math score, adjusted for starting level"}, "caption": "Effect on math scores in standard deviations, with the 95% range from 0.027 to 0.488", "catch": "Google, Gemini's maker, co-wrote this unreviewed report. The Gemini group started lower; without adjusting for that, the effect (0.216) could be chance. Gemini came with devices, teacher training and monitors.", "takeaway": "Teacher-led lessons with a guiding AI tutor raised math scores here, and students already ahead gained most.", "topic": "AI tutors", "source": {"citation": "LearnLM Team & Fab AI, 2026", "url": "https://storage.googleapis.com/deepmind-media/LearnLM/learnLM_sierraleone_may26.pdf", "page": "p. 3"}, "country": "Sierra Leone", "year": 2026, "id": "gemini-sierra-leona-2026", "guess": {"prompt": "After eight weeks with Gemini, what happened to their math scores?", "options": ["Math scores went down", "Math scores went up, after adjusting for starting level", "No real change in math scores"], "correct": 1}, "recall": {"prompt": "In the Sierra Leone trial of Gemini's Guided Learning in 7th and 8th grade math, which students gained most?", "options": ["Students who were already ahead", "Students who started furthest behind", "All students gained about equally"], "correct": 0, "explain": "Students already ahead gained more: the effect grew by 0.195 standard deviations for each standard deviation of starting score."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens to learning when kids get twice as much computer practice each week?", "answer": "In math, doubling added nothing; in language, the double dose canceled the gain from the single dose.", "story": "Across 343 Russian schools, 6,253 third-graders swapped some paper homework for math and language exercises for one school year. Classes got a single dose (about 20 to 25 minutes per subject weekly), a double dose, or kept paper homework. A single dose gave a moderate math gain; doubling did no better; in language, doubling canceled the single dose's gain.", "chart": {"type": "bars", "unit": "standard deviations above paper homework", "bars": [{"label": "Math, single dose", "value": 0.108}, {"label": "Math, double dose", "value": 0.101}, {"label": "Language, single dose", "value": 0.059}, {"label": "Language, double dose", "value": -0.025}]}, "caption": "Gain over paper homework by subject and dose; single-dose math moves a student from 50th to 54th of 100", "catch": "Not generative AI: prewritten exercises. The platform's company trained teachers and supplied data, full usage data was missing, and the single-dose language gain was statistically shaky.", "takeaway": "Some computer practice in place of paper homework helped math, but doubling it brought no extra benefit.", "topic": "Adaptive practice", "source": {"citation": "Bettinger, Fairlie, Kapuza, Kardanova, Loyalka, Zakharov, 2023", "url": "https://doi.org/10.1002/pam.22442", "page": "p. 561"}, "country": "Russia", "year": 2023, "id": "rusia-cal-dosis-2023", "guess": {"prompt": "What did doubling the weekly computer practice do for learning?", "options": ["Gains grew, but by less than double", "Gains roughly doubled", "No extra gain, and a language gain vanished"], "correct": 2}, "recall": {"prompt": "In the Russian third-grade trial of computer homework, what did doubling the weekly practice do for math?", "options": ["It added nothing beyond the single dose", "It roughly doubled the math gain", "It turned the math gain negative"], "correct": 0, "explain": "A single dose raised math by 0.108 standard deviations and a double dose by 0.101, so doubling added no extra benefit."}, "kind": "A rigorous randomized trial"}, {"hook": "Do teens remember a history text better after chatting with an AI or after taking notes?", "answer": "Notes won: days later, students understood and remembered less of the text they had studied with the chatbot alone.", "story": "In 7 schools in England, 344 students aged 14 to 15 each studied two short history texts. In one group of 184, each student studied one text by taking notes and the other with a GPT-3.5 chatbot. Three days later, without AI, comprehension averaged 4.00 out of 12 for the chatbot text versus 4.89 for notes.", "chart": {"type": "bars", "unit": "points out of 12", "bars": [{"label": "Chatbot alone", "value": 4}, {"label": "Taking notes", "value": 4.89}]}, "caption": "Average comprehension score three days later, same students, chatbot text vs. notes text", "catch": "One 10 to 15 minute session with GPT-3.5, run by researchers who built the chatbot. The comparison was note-taking, not plain reading, so it doesn't show whether the chatbot beats doing nothing.", "takeaway": "For remembering a text days later, taking notes beat a short session with a chatbot alone.", "topic": "ChatGPT & learning", "source": {"citation": "Kreijkes et al., 2026", "url": "https://doi.org/10.1016/j.compedu.2025.105514", "page": "p. 13"}, "country": "United Kingdom", "year": 2026, "id": "inglaterra-llm-toma-de-notas-2026", "guess": {"prompt": "Three days later, which text did students understand and remember better?", "options": ["The one studied with the chatbot", "No real difference between them", "The one studied by taking notes"], "correct": 2}, "recall": {"prompt": "In the English schools trial on history texts, how did chatbot study compare with notes three days later?", "options": ["Notes scored higher: 4.89 vs. 4.00 out of 12", "Chatbot scored higher: 4.89 vs. 4.00 out of 12", "Both scored about the same"], "correct": 0, "explain": "Tested without AI, comprehension averaged 4.00 out of 12 for the chatbot text versus 4.89 for the text studied with notes."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "Which study habits actually work, and are the most popular ones among them?", "answer": "Testing yourself and spacing study out rated best. Rereading and highlighting, the most common habits, rated low.", "story": "Five psychologists reviewed research up to 2012 on 10 techniques students can use alone. They judged how well each helps different learners, materials and tests. Only practice testing and spacing study over time earned high utility. Rereading, highlighting, summarizing, the keyword mnemonic and mental imagery rated low, usually compared with plain reading or rereading.", "chart": {"type": "bars", "unit": "% of college students", "bars": [{"label": "List rereading as a study technique", "value": 84}, {"label": "Name rereading as their most used technique", "value": 55}]}, "caption": "A survey cited in the review: rereading, a low-utility habit, is students' top choice", "catch": "This is a narrative review, so the ratings are the authors' judgments, not pooled numbers. Many studies were single lab sessions with college students. It predates newer work such as a large 2020 interleaving trial.", "takeaway": "Quizzing yourself and spreading study out beat rereading and highlighting, the habits students use most.", "topic": "Learning science", "source": {"citation": "Dunlosky, Rawson, Marsh, Nathan & Willingham, 2013", "url": "https://web.archive.org/web/20141117055821/http://psi.sagepub.com/content/14/1/4.full.pdf", "page": "p. 2"}, "country": "Not specified (review of the literature)", "year": 2013, "id": "tecnicas-dunlosky-2013", "guess": {"prompt": "Did the most popular study habits rate well in this review?", "options": ["They rated in the middle, below a few others", "No, they rated low; self-testing did best", "Yes, rereading and highlighting rated best"], "correct": 1}, "recall": {"prompt": "In Dunlosky and colleagues' 2013 review of 10 study techniques, which two earned a high utility rating?", "options": ["Summarizing and mental imagery", "Rereading and highlighting", "Practice testing and spacing study over time"], "correct": 2, "explain": "Only practice testing and spaced study rated high. Rereading, which 84% of surveyed college students use, rated low."}, "kind": "A review of studies"}, {"hook": "When every student has the same AI tutor, what else can help them learn more?", "answer": "Letting an algorithm choose the order of practice problems raised final exam scores, mostly for beginners.", "story": "In 10 Taipei high schools, 1,047 students took a five-month Python course with the same GPT-4o tutor that held back answers. Some got exercises in an order chosen by an adaptive algorithm. Others got a fixed easy-to-hard order. On a handwritten, no-device final exam, the adaptive group scored 0.15 of a standard deviation higher.", "chart": {"type": "effect", "value": 0.15, "low": 0.02, "high": 0.28, "label": "Final Python exam score (handwritten, no devices)"}, "caption": "Adaptive vs fixed order, same tutor. Beginners: +0.215 SD; students with prior Python: +0.008", "catch": "Not peer reviewed, and the authors built the tool. It compares AI with AI, not tutor vs none. Including excluded final-year students, the effect drops to 0.114 SD and isn't significant.", "takeaway": "With the same AI tutor, a smarter order of practice problems helped beginners learn Python more.", "topic": "AI tutors", "source": {"citation": "Chung et al., 2026", "url": "https://arxiv.org/abs/2608.16907", "page": "p. 14"}, "country": "Taiwan", "year": 2026, "id": "taipei-adaptativo-2026", "guess": {"prompt": "Same AI tutor, but an algorithm picks the problem order. What happened?", "options": ["Scores rose, mostly for beginners", "Scores rose, mostly for students who knew Python", "No real change in exam scores"], "correct": 0}, "recall": {"prompt": "In the Taipei high school Python trial with one AI tutor, who gained most from adaptive problem order?", "options": ["Everyone gained about the same, around 0.15 SD", "Beginners gained 0.215 SD; experienced students barely moved", "Students with prior Python gained 0.215 SD"], "correct": 1, "explain": "Beginners scored 0.215 SD higher with adaptive order, while students with prior Python gained just 0.008 SD."}, "kind": "A randomized trial, with limits"}, {"hook": "Every school had free math software. What changed when someone made sure kids used it?", "answer": "Students practiced far more and scored higher in math, a large gain for an education program.", "story": "In 83 public boarding schools in Uttar Pradesh, India, some schools got staff dedicated to running two Khan Academy math sessions a week for 31 weeks. Students there practiced 47.4 minutes a week versus 7.2 in schools with the same platform but no staff, and scored 0.326 standard deviations higher on a math test built for the study.", "chart": {"type": "effect", "value": 0.326, "low": null, "high": null, "label": "math test score, grades 6 to 8"}, "caption": "Gain in math scores in standard deviations, all 80 tested schools (0.44 in a smaller sample)", "catch": "Not peer reviewed, and a Khan Academy staffer co-authored it. 44.5% of students missed the final test. Not generative AI: every school had the platform; what was tested was the staff support.", "takeaway": "Software alone was barely used; staff who guaranteed class time for practice raised math scores here.", "topic": "Learning science", "source": {"citation": "Oreopoulos, Keyes-Krysakowski & Agarwal, 2026", "url": "https://www.nber.org/papers/w34683", "page": "p. 17"}, "country": "India", "year": 2026, "id": "khan-academy-uttar-pradesh-2026", "guess": {"prompt": "With staff making sure kids used it, what happened to practice and math scores?", "options": ["More practice and much higher scores", "No real change in practice or scores", "More practice, but scores didn't move"], "correct": 0}, "recall": {"prompt": "In the Uttar Pradesh Khan Academy trial, how much did students with dedicated staff practice weekly?", "options": ["47.4 minutes, vs. 7.2 without staff", "About the same as schools without staff", "7.2 minutes, vs. 47.4 without staff"], "correct": 0, "explain": "Staffed schools practiced 47.4 minutes a week versus 7.2 with the platform alone, and math scores rose 0.326 standard deviations."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens to your own creativity if you brainstorm before asking ChatGPT?", "answer": "Students who thought first were more original later on their own, without AI. Free ChatGPT use gave no edge once the AI was gone.", "story": "In Singapore, 196 university students did a creative task in one lab session: no AI, free ChatGPT, or 3 minutes of own ideas, 6 with ChatGPT and 3 refining alone. Minutes later, working without AI, the think-first group's ideas were rated more original than both others, by 0.52 and 0.48 standard deviations.", "chart": {"type": "bars", "unit": "average originality score", "bars": [{"label": "No AI", "value": 2.63}, {"label": "Free ChatGPT", "value": 2.69}, {"label": "Think first, then ChatGPT", "value": 3.42}]}, "caption": "Average originality score on the later task, done by everyone without AI", "catch": "This was one lab session with university students. The 'later' test came minutes after, and the authors designed both the task and the method. It says nothing yet about schoolchildren or lasting learning.", "takeaway": "Coming up with your own ideas before asking ChatGPT helped students stay original once the AI was gone.", "topic": "ChatGPT & learning", "source": {"citation": "Wong & Qiu, 2026", "url": "https://doi.org/10.1007/s10648-026-10118-7", "page": "p. 20"}, "country": "Singapore", "year": 2026, "id": "pensar-primero-singapur-2026", "guess": {"prompt": "Later, working without AI, how original were the think-first students?", "options": ["About the same as the other groups", "More original than both other groups", "Less original than the free ChatGPT group"], "correct": 1}, "recall": {"prompt": "In the Singapore lab study of 196 university students, how did free ChatGPT users do later without AI?", "options": ["Better than the no-AI group", "About the same as the no-AI group", "Worse than the no-AI group"], "correct": 1, "explain": "Free ChatGPT users scored 2.69 versus 2.63 for no AI. Only the think-first group (3.42) pulled ahead."}, "kind": "A randomized lab experiment, with limits"}, {"hook": "Should algebra learners solve every practice problem, or study some already solved?", "answer": "Students who studied worked examples solved similar test problems faster, but the edge did not carry over to new kinds of problems.", "story": "In two Sydney secondary schools, 22 Year 9 students practised eight algebra problems, 11 per group. One group studied a solved example before each matching problem; the other solved all eight themselves. On four test problems of the same type, the worked-example group took 43.6 seconds per problem versus 78.1.", "chart": {"type": "bars", "unit": "seconds per test problem", "bars": [{"label": "Studied worked examples", "value": 43.6}, {"label": "Solved all problems themselves", "value": 78.1}]}, "caption": "Average seconds per test problem on equations like those practised (Experiment 3)", "catch": "Tiny groups of 11, one short session, tests built by the authors and given right away. The advantage didn't always repeat in other experiments and didn't appear on differently structured problems.", "takeaway": "Studying solved examples can speed up the same kind of problem; transfer to new problems wasn't shown.", "topic": "Learning science", "source": {"citation": "Sweller & Cooper, 1985", "url": "https://doi.org/10.1207/s1532690xci0201_3", "page": "p. 19"}, "country": "Australia", "year": 1985, "id": "australia-ejemplos-resueltos-algebra-1985", "guess": {"prompt": "On test problems like the ones practised, who solved them faster?", "options": ["Students who studied worked examples", "Students who solved all problems themselves", "No real difference in speed"], "correct": 0}, "recall": {"prompt": "In the 1985 Sydney Year 9 algebra study on worked examples, what happened on new kinds of problems?", "options": ["The problem-solving group was faster", "Neither group showed a clear advantage", "The worked-example group was much faster"], "correct": 1, "explain": "Worked examples sped up familiar problems (43.6 vs 78.1 seconds), but the edge did not carry over to new kinds of problems."}, "kind": "A randomized lab experiment, with limits"}, {"hook": "Can a short chat with an AI coach make you a better listener to someone in trouble?", "answer": "In one 20-minute online session, AI feedback helped adults reply with more empathy, as scored by an AI judge.", "story": "Researchers had 968 U.S. adults text with an AI-simulated person sharing a work or personal problem, three four-minute chats in one session. Some got personalized feedback from an AI coach between chats; a control group just practiced. The coach raised overall empathy scores by 0.98 standard deviations; two short videos from a human coach, by 0.55.", "chart": {"type": "bars", "unit": "% of participants", "bars": [{"label": "Practice only (control)", "value": 2.9}, {"label": "Human coach videos", "value": 9}, {"label": "AI coach", "value": 21.6}, {"label": "AI coach + videos", "value": 26.3}]}, "caption": "Share of participants whose empathy score reliably improved within the session, by group", "catch": "Measured in the same 20-minute session, with no later follow-up, and scored by GPT-4o using the same six-technique framework the coach taught. The authors built the coach. Preprint, not peer reviewed.", "takeaway": "Personalized AI feedback improved how adults wrote supportive replies right away; whether it lasts is untested.", "topic": "AI tutors", "source": {"citation": "Kumar, Poungpeth, Yang, Lambert, Groh, 2026", "url": "https://arxiv.org/pdf/2603.15245", "page": "p. 8"}, "country": "United States", "year": 2026, "id": "estados-unidos-coach-ia-comunicacion-empatica-2026", "guess": {"prompt": "After AI coach feedback, what happened to people's empathy scores?", "options": ["No real change", "They went down", "They went up"], "correct": 2}, "recall": {"prompt": "In the U.S. online study of an AI empathy coach, how did the AI coach compare with short human coach videos?", "options": ["Neither changed empathy scores", "The AI coach raised empathy scores more", "The videos raised empathy scores more"], "correct": 1, "explain": "In one 20-minute session, the AI coach raised empathy scores by 0.98 standard deviations, and the human coach videos by 0.55."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "What happened when a huge free coding class offered students a GPT-4 chat?", "answer": "Fewer students took the optional exam (44.1% vs 48.5%), only 14.2% used the chat, and scores barely moved.", "story": "Researchers randomly gave 3,581 of 5,831 students in Stanford's free online Python course, from 146 countries, access to a GPT-4 chat in week 4; 2,250 got no chat. Nine days later, fewer offered students sat the optional exam and finished week-6 homework. Average scores rose only 0.67 points out of 100, not a clear effect.", "chart": {"type": "bars", "unit": "% who took the optional exam", "bars": [{"label": "Offered GPT-4 chat", "value": 44.1}, {"label": "No chat offered", "value": 48.5}]}, "caption": "Share of students who took the optional exam, by group", "catch": "Not peer reviewed in this version; the authors built the chat and OpenAI funded part of the work. Over half skipped the exam, and the 6.86-point gain for users isn't statistically clear.", "takeaway": "Offering an AI chat in an online course didn't clearly raise scores and led to fewer students taking the exam.", "topic": "ChatGPT & learning", "source": {"citation": "Nie et al., 2025", "url": "https://arxiv.org/pdf/2407.09975v2", "page": "p. 6"}, "country": "Global (146 countries)", "year": 2025, "id": "global-curso-programacion-gpt-2025", "guess": {"prompt": "Did offering the GPT-4 chat change how many students took the exam?", "options": ["Fewer students took the optional exam", "No real change in who took it", "More students took the optional exam"], "correct": 0}, "recall": {"prompt": "In Stanford's free online Python course trial offering a GPT-4 chat, what happened to average exam scores?", "options": ["They barely moved", "They rose sharply", "They fell sharply"], "correct": 0, "explain": "Average scores rose only 0.67 points out of 100, not a clear effect, and only 14.2% of offered students used the chat."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when young kids learn bar graphs made of little pictures instead of plain bars?", "answer": "Many counted the pictures instead of reading the axis, and they read graphs less accurately than kids taught with plain bars.", "story": "Researchers in suburban Columbus, Ohio, randomly taught 122 children in kindergarten to 2nd grade to read bar graphs, either with plain bars or bars built from countable pictures, in one session. With plain bars, all 1st and 2nd graders and 75% of kindergarteners read the graphs correctly. With pictures, 90% of kindergarteners and 72% of 1st graders counted the pictures.", "chart": {"type": "bars", "unit": "% of kindergarteners who read plain-bar graphs correctly", "bars": [{"label": "Learned with picture bars", "value": 64}, {"label": "Learned with plain bars", "value": 96}]}, "caption": "Kindergarteners in Experiment 3 (44 children) who read plain graphs correctly, by how they learned", "catch": "One session, tested right away with the authors' own tasks, with no later follow-up. Kindergarten results come from small groups. The pictures were both countable and eye-catching, and the study did not separate those two effects.", "takeaway": "For young children learning bar graphs, countable pictures inside the bars can distract. Plain bars led to better reading.", "topic": "Learning science", "source": {"citation": "Kaminski & Sloutsky, 2013", "url": "https://doi.org/10.1037/a0031040", "page": "p. 4"}, "country": "United States", "year": 2013, "id": "estados-unidos-informacion-irrelevante-graficos-barras-2013", "guess": {"prompt": "Compared with kids taught with plain bars, how did the picture-bar kids do?", "options": ["No real difference in accuracy", "They read graphs less accurately", "They read graphs more accurately"], "correct": 1}, "recall": {"prompt": "In the Ohio study of young kids learning bar graphs made of little pictures, what did many of them do?", "options": ["Read the axis more carefully than other kids", "Skipped the graphs and guessed at random", "Counted the pictures instead of reading the axis"], "correct": 2, "explain": "With picture bars, 90% of kindergarteners and 72% of 1st graders counted the pictures instead of reading the axis."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "After three months with an AI assistant, are lawyers sharper or rustier without it?", "answer": "Experienced lawyers got better at reviewing drafts on their own. Less experienced ones showed no clear gain on average.", "story": "133 patent lawyers at eleven U.S. firms were randomly split: 90 got a Google AI writing assistant for 90 days, and 43 kept their usual tools. Then 91 of them marked up a flawed patent draft without AI, scored by blind expert reviewers. The AI group scored higher, and all of the gain came from lawyers with 7 or more years' experience.", "chart": {"type": "effect", "value": 0.317, "low": 0.03, "high": 0.61, "label": "Quality of a patent review done without AI, after 90 days (standard deviations)"}, "caption": "Gain of the AI group over the no-AI group, in standard deviations, with its 95% range", "catch": "Google ran and funded the study of its own tool. It is not peer reviewed, and 32% didn't take the final test. Dropping 15 entries possibly done with AI makes the gain unclear.", "takeaway": "In one trial, experienced lawyers who used AI for months reviewed better without it; juniors showed no clear gain.", "topic": "ChatGPT & learning", "source": {"citation": "Autor et al., 2026", "url": "https://doi.org/10.3386/w35720", "page": "p. 2"}, "country": "United States", "year": 2026, "id": "estados-unidos-asistente-ia-patentes-abogados-2026", "guess": {"prompt": "After 90 days with AI, how did lawyers do reviewing a draft without it?", "options": ["Sharper, with the gain among experienced lawyers", "No real difference from the no-AI group", "Rustier: they scored lower without AI"], "correct": 0}, "recall": {"prompt": "In Google's 90-day trial with U.S. patent lawyers, who got better at reviewing drafts without AI?", "options": ["Both groups about equally", "Mostly the less experienced lawyers", "Lawyers with 7 or more years' experience"], "correct": 2, "explain": "The AI group scored higher without AI, but the gain came entirely from lawyers with 7 or more years' experience; juniors showed no clear gain."}, "kind": "A rigorous randomized trial"}], "base": {"documentos": 1749, "verificados": 395}}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("datos").textContent);
  const CARDS = D.tarjetas;
  const BASE_N = D.base || { documentos: 1749, verificados: 395 };
  const POR_ID = Object.fromEntries(CARDS.map((c) => [c.id, c]));
  const TEMAS = {
    "AI tutors": { c: "#2f4bff", t: "#ffffff", s: "#d9deff" },
    "ChatGPT & learning": { c: "#ff4a2b", t: "#ffffff", s: "#ffd8cf", o: "#d63414" },
    "Teachers & AI": { c: "#00996f", t: "#ffffff", s: "#c9efe2", o: "#007a58" },
    "Reading": { c: "#ffbd14", t: "#0d0d12", s: "#ffeab0", o: "#a87400" },
    "Learning science": { c: "#7b2ff7", t: "#ffffff", s: "#e3d4ff" },
    "Myths": { c: "#ff2d87", t: "#ffffff", s: "#ffd1e5", o: "#d0106a" },
    "Screens & phones": { c: "#0d0d12", t: "#ffffff", s: "#dcdce3" },
    "Adaptive practice": { c: "#00a6a6", t: "#ffffff", s: "#c8eeee", o: "#007d7d" },
    "Cost & scale": { c: "#3d3d47", t: "#ffffff", s: "#e2e2e8" },
    "Policy": { c: "#5b6cff", t: "#ffffff", s: "#dde1ff" },
  };
  const META_DIA = 3;
  // Spaced review, Leitner style: a paper comes back 1, 3, 7 and 21 days after
  // you read it; a miss sends it back to one day.
  const INTERVALOS = [1, 3, 7, 21];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const hoyStr = () => new Date().toLocaleDateString("en-CA");
  const masDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };

  const vistas = new Set(leer("pod-vistas", []));
  const guardados = new Set(leer("pod-guardados", []));
  const repaso = leer("pod-repaso", {});      // id -> { caja, vence }
  const dias = leer("pod-dias", {});          // fecha -> papers terminados ese día
  // Al volver, abre donde quedaste: el paper y la pantalla. Si no hay registro,
  // el primero sin leer.
  const pos = leer("pod-pos", null);
  const enPos = pos ? CARDS.findIndex((c) => c.id === pos.id) : -1;
  let i = enPos >= 0 ? enPos : CARDS.findIndex((c) => !vistas.has(c.id));
  if (i < 0) i = 0;
  let paso = enPos >= 0 ? Math.min(Math.max(pos.paso | 0, 0), 3) : 0, adivino = null, filtro = "";
  let modo = "papers", cola = [], qi = 0, respondida = null;

  const vencidos = () => Object.entries(repaso).filter(([id, r]) => POR_ID[id]?.recall && r.vence <= hoyStr()).map(([id]) => id);
  function racha() {
    let n = 0; const d = new Date();
    if (!dias[hoyStr()]) d.setDate(d.getDate() - 1);
    while (dias[d.toLocaleDateString("en-CA")]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function pintarRacha() {
    const r = racha(), hoy = dias[hoyStr()] || 0;
    // «11/3 today» se leía raro pasada la meta (captura del usuario, 2026-10-17).
    $("racha").textContent = `${hoy >= META_DIA ? `${hoy} today · goal of ${META_DIA} done` : `${hoy}/${META_DIA} today`}${r ? ` · ${r}-day streak` : ""}`;
    const v = vencidos().length;
    $("b-repaso").hidden = !v || modo === "repaso";
    $("t-repaso").textContent = `Review ${v}`;
  }
  function terminar(c) {
    if (vistas.has(c.id)) return;
    vistas.add(c.id); guardar("pod-vistas", [...vistas]);
    dias[hoyStr()] = (dias[hoyStr()] || 0) + 1; guardar("pod-dias", dias);
    if (c.recall && !repaso[c.id]) { repaso[c.id] = { caja: 0, vence: masDias(INTERVALOS[0]) }; guardar("pod-repaso", repaso); }
  }

  function colores(c) {
    const t = TEMAS[c.topic] || TEMAS["AI tutors"];
    const r = $("reel").style;
    r.setProperty("--tema", t.c); r.setProperty("--tema-tinta", t.t); r.setProperty("--tema-suave", t.s);
    if (t.o) r.setProperty("--tema-oscuro", t.o); else r.removeProperty("--tema-oscuro");
    return t;
  }
  function efecto(c, t) {
    const v = c.value, lo = c.low ?? v, hi = c.high ?? v;
    const min = Math.min(-0.3, lo - 0.1), max = Math.max(0.6, hi + 0.15);
    const W = 320, x = (z) => 12 + ((z - min) / (max - min)) * (W - 24);
    const col = t.o || t.c;
    const zona = (a, b, et, op) => `<rect x="${x(a)}" y="30" width="${Math.max(0, x(Math.min(b, max)) - x(a))}" height="34" fill="${col}" opacity="${op}"/><text x="${(x(a) + x(Math.min(b, max))) / 2}" y="82" text-anchor="middle" font-size="10.5" fill="#4a4a55">${et}</text>`;
    return `<svg viewBox="0 0 ${W} 96" role="img" aria-label="Effect of ${v} standard deviations">
      ${min < 0 ? `<rect x="${x(min)}" y="30" width="${x(0) - x(min)}" height="34" fill="#f4f4f7"/><text x="${(x(min) + x(0)) / 2}" y="82" text-anchor="middle" font-size="10.5" fill="#4a4a55">worse</text>` : ""}
      ${zona(0, 0.05, "", 0.06)}${zona(0.05, 0.2, "moderate", 0.12)}${zona(0.2, max, "large", 0.2)}
      <line x1="${x(0)}" y1="22" x2="${x(0)}" y2="70" stroke="#0d0d12" stroke-width="2"/>
      <text x="${x(0)}" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0d0d12">0</text>
      ${c.low != null && c.high != null ? `<line x1="${x(lo)}" y1="47" x2="${x(hi)}" y2="47" stroke="#0d0d12" stroke-width="3" stroke-linecap="round"/>` : ""}
      <circle cx="${x(v)}" cy="47" r="9" fill="${t.c}" stroke="#0d0d12" stroke-width="2.5"/>
    </svg>`;
  }
  function barras(c, t) {
    const bs = c.bars.slice(0, 4), maxV = Math.max(...bs.map((b) => Math.abs(b.value)), 1e-9);
    const neg = bs.some((b) => b.value < 0);
    const W = 320, H = 210, w = (W - 20) / bs.length, top = 30, bottom = H - 46;
    const cero = neg ? (top + bottom) / 2 : bottom, alto = neg ? (bottom - top) / 2 : bottom - top;
    const pct = /%|percent/i.test(c.unit ?? "");
    const valor = (v) => `${neg && v > 0 ? "+" : ""}${String(v).replace("-", "−")}${pct ? "%" : ""}`;
    const corte = (s, k) => { const out = ["", ""]; let j = 0; for (const p of String(s).split(" ")) { if ((out[j] + " " + p).trim().length > 22 && j === 0) j = 1; out[j] = (out[j] + " " + p).trim(); } return out[k].slice(0, 26); };
    const tonos = [t.c, "#0d0d12", "#9a9aa6", "#c9c9d2"];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(bs.map((b) => b.label + " " + b.value).join(", "))}">
      ${bs.map((b, k) => { const h = (Math.abs(b.value) / maxV) * alto; const cx = 10 + k * w + w / 2; const y = b.value >= 0 ? cero - h : cero; const ty = b.value >= 0 ? cero - h - 9 : cero - 9; return `
        <rect x="${cx - w * 0.32}" y="${y}" width="${w * 0.64}" height="${Math.max(h, 2)}" fill="${tonos[k % 4]}"/>
        <text x="${cx}" y="${ty}" text-anchor="middle" font-size="17" font-weight="700" fill="#0d0d12">${esc(valor(b.value))}</text>
        <text x="${cx}" y="${H - 24}" text-anchor="middle" font-size="11.5" fill="#4a4a55">${esc(corte(b.label, 0))}</text>
        <text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11.5" fill="#4a4a55">${esc(corte(b.label, 1))}</text>`; }).join("")}
      <line x1="4" y1="${cero}" x2="${W - 4}" y2="${cero}" stroke="#0d0d12" stroke-width="1.5"/>
    </svg>${c.unit ? `<p class="nota">${esc(c.unit)}</p>` : ""}`;
  }
  function lamina(c, t) {
    if (paso === 0) {
      const g = c.guess;
      return `<span class="tema">${esc(c.topic)}</span><h1 class="pregunta">${esc(c.hook)}</h1>${g ? `<div class="opciones"><p>${esc(g.prompt)}</p>${g.options.map((o, k) => `<button class="opcion" type="button" data-g="${k}">${esc(o)}</button>`).join("")}</div>` : `<span class="pista">Tap to find out →</span>`}`;
    }
    if (paso === 1) {
      const g = c.guess;
      const veredicto = g && adivino != null ? (adivino === g.correct ? `<p class="dijiste si">You guessed right</p>` : `<p class="dijiste no">You guessed: ${esc(g.options[adivino])}</p>`) : "";
      return `${veredicto}<p class="etiqueta">The answer</p><p class="respuesta">${esc(c.answer)}</p><p class="historia">${esc(c.story)}</p>`;
    }
    if (paso === 2) {
      const ch = c.chart || {};
      const grande = ch.type === "effect" ? `${ch.value > 0 ? "+" : ""}${String(ch.value).replace("-", "−")}<span style="font-size:.38em;letter-spacing:0"> SD</span>` : "";
      // Sin cifras en el paper (Rogowsky: el resumen no da puntajes), no hay gráfico.
      if (!ch.type) return `<p class="etiqueta">The number</p><p class="respuesta">No number to show</p><p class="leyenda">${esc(c.caption)}</p>`;
      return `<p class="etiqueta">The number</p>${grande ? `<p class="cifra-grande">${grande}</p>` : ""}${ch.type === "bars" ? barras(ch, t) : efecto(ch, t)}<p class="leyenda">${esc(c.caption)}</p>${ch.type === "effect" ? `<p class="nota">SD means standard deviations, the unit researchers use to compare different tests. For education programs, under 0.05 is small, 0.05 to 0.2 moderate, 0.2 or more large (Kraft's scale).${ch.low != null ? " The black line is the 95% range: if it crosses zero, the study cannot rule out no effect at the usual 5% level." : ""}</p>` : ""}`;
    }
    return `<p class="etiqueta">The catch</p><p class="trampa">${esc(c.catch)}</p><p class="recuerda"><small>Remember</small>${esc(c.takeaway)}</p>
      <div class="acciones"><button class="chico" id="b-guardar" type="button" aria-pressed="${guardados.has(c.id)}">${guardados.has(c.id) ? "Saved" : "Save"}</button><button class="chico" id="b-copiar" type="button">Copy to share</button><span class="aviso" id="aviso"></span></div>
      ${promo()}
      <p class="fuente"><span class="tipo">${esc(c.kind || "")}</span><br><a href="${esc(c.source.url)}" target="_blank" rel="noopener">${esc(c.source.citation)}${c.source.page ? ", " + esc(c.source.page) : ""}</a> · ${esc(c.country)}${c.year ? ", " + esc(c.year) : ""}</p>`;
  }

  // Review: the recall question of a paper read days ago.
  function laminaRepaso() {
    if (qi === -1) return `<p class="etiqueta">Quick review</p><h1 class="pregunta" style="font-size:clamp(1.9rem,8vw,2.6rem)">Before new papers: ${cola.length} question${cola.length === 1 ? "" : "s"} on what you read.</h1><p class="nota">Remembering without looking is what makes it stick. It takes a minute.</p>`;
    const c = POR_ID[cola[qi]], r = c.recall;
    const ops = r.options.map((o, k) => `<button class="opcion${respondida == null ? "" : k === r.correct ? " bien" : k === respondida ? " mal" : ""}" type="button" data-r="${k}"${respondida == null ? "" : " disabled"}>${esc(o)}</button>`).join("");
    return `<p class="etiqueta">Review ${qi + 1} of ${cola.length} · ${esc(c.topic)}</p><h1 class="pregunta" style="font-size:clamp(1.5rem,6.4vw,2.05rem);line-height:1.08">${esc(r.prompt)}</h1><div class="opciones">${ops}</div>${respondida != null ? `<p class="explica">${esc(r.explain)}</p>` : ""}`;
  }

  // El logo de redevidencia.org: la traza que se asienta en la línea dorada. Va
  // en la bienvenida y al pie de cada paper, no en todas partes (usuario, 2026-10-17).
  const LOGO = (clase) => `<a class="logo ${clase}" href="https://redevidencia.org" target="_blank" rel="noopener" aria-label="EvidencIA"><svg viewBox="0 0 130 60" aria-hidden="true"><path d="M4 30 L16 8 L28 52 L40 14 L50 44 L58 30 L126 30" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line class="oro" x1="58" y1="30" x2="126" y2="30" stroke-width="7" stroke-linecap="round"/></svg><span>Evidenc<b>IA</b></span></a>`;
  // Al pie de cada paper, un solo camino a EvidencIA y no los cuatro juntos: con
  // todos, la última pantalla no entraba sin bajar, y casi nadie baja (usuario,
  // 2026-10-17). Rota con el número del paper.
  function promo() {
    const caminos = [
      [`These ${CARDS.length} are a small part of a base of ${BASE_N.documentos.toLocaleString("en-US")} documents.`, "https://redevidencia.org/#evidencia", "See all the evidence"],
      ["Ask your own AI about studies like this one.", "https://mcp.redevidencia.org/#conectar", "Connect EvidencIA to your AI"],
      ["See what EvidencIA is building across Latin America.", "https://redevidencia.org/#iniciativas", "EvidencIA initiatives"],
      ["A network on AI and the science of learning.", "https://redevidencia.org", "Visit EvidencIA"],
    ];
    const [frase, url, texto] = caminos[i % caminos.length];
    return `<div class="red">${LOGO("chico")}<p class="parte">${esc(frase)}</p><a href="${url}" target="_blank" rel="noopener">${esc(texto)} →</a></div>`;
  }
  // Quien llega por el QR de una charla no sabe qué es esto: una pantalla, una vez.
  function laminaBienvenida() {
    return `${LOGO("grande")}<p class="etiqueta" style="color:#ffbd14">From EvidencIA's evidence base</p><h1 class="pregunta" style="font-size:clamp(2rem,8.6vw,2.9rem)">${CARDS.length} studies behind what we know about AI and learning.</h1>
      <ul class="pasos"><li><b>1</b><span>Read the question and make a guess.</span></li><li><b>2</b><span>See the answer, the number and the catch.</span></li><li><b>3</b><span>A few days later, a quick question helps you remember.</span></li></ul>
      <p class="nota" style="color:#c9c9d2">One or two minutes each. Every number comes from the study, with a link to the page.</p>`;
  }
  function pintar() {
    $("reel").classList.toggle("bienvenida", modo === "bienvenida");
    if (modo === "bienvenida") {
      $("reel").classList.remove("portada", "repaso");
      $("lamina").innerHTML = laminaBienvenida();
      [...$("segmentos").children].forEach((s) => s.classList.remove("hecho"));
      $("num").textContent = "";
      $("b-atras").hidden = true;
      $("b-adelante").textContent = "Start";
      pintarRacha(); return;
    }
    $("b-atras").hidden = false;
    $("reel").classList.toggle("repaso", modo === "repaso");
    if (modo === "repaso") {
      $("reel").classList.remove("portada");
      $("lamina").innerHTML = laminaRepaso();
      [...$("segmentos").children].forEach((s) => s.classList.add("hecho"));
      $("num").textContent = "Review";
      $("b-atras").textContent = "Skip review";
      $("b-atras").disabled = false;
      $("b-adelante").textContent = qi === -1 ? "Start" : respondida == null ? "Show answer" : qi < cola.length - 1 ? "Next" : "Back to papers";
    } else {
      const c = CARDS[i], t = colores(c);
      $("reel").classList.toggle("portada", paso === 0);
      $("lamina").innerHTML = lamina(c, t);
      [...$("segmentos").children].forEach((s, k) => s.classList.toggle("hecho", k <= paso));
      $("num").textContent = `${i + 1} of ${CARDS.length}`;
      $("b-atras").textContent = paso === 0 ? "‹ Previous" : "Back";
      $("b-atras").disabled = paso === 0 && i === 0;
      $("b-adelante").textContent = paso === 0 ? (c.guess ? "Skip guess" : "Show me") : paso < 3 ? "Next" : (i < CARDS.length - 1 ? "Next paper ›" : "Start again");
      guardar("pod-pos", { id: c.id, paso });
      if (paso === 3) terminar(c);
    }
    $("lamina").style.animation = "none"; void $("lamina").offsetWidth; $("lamina").style.animation = "";
    pintarRacha();
  }
  function responderRepaso(k) {
    const id = cola[qi], r = POR_ID[id].recall, e = repaso[id] || { caja: 0 };
    respondida = k;
    const acierto = k === r.correct;
    e.caja = acierto ? Math.min(e.caja + 1, INTERVALOS.length - 1) : 0;
    e.vence = masDias(INTERVALOS[e.caja]);
    repaso[id] = e; guardar("pod-repaso", repaso);
    pintar();
  }
  function adelante() {
    if (modo === "bienvenida") { guardar("pod-bienvenida", true); modo = "papers"; paso = 0; pintar(); return; }
    if (modo === "repaso") {
      if (qi === -1) { qi = 0; respondida = null; pintar(); return; }
      if (respondida == null) { responderRepaso(-1); return; }
      if (qi < cola.length - 1) { qi++; respondida = null; pintar(); return; }
      modo = "papers"; paso = 0; adivino = null; pintar(); return;
    }
    if (paso < 3) { paso++; pintar(); return; }
    i = (i + 1) % CARDS.length; paso = 0; adivino = null; pintar();
  }
  function atras() {
    if (modo === "repaso") { modo = "papers"; paso = 0; adivino = null; pintar(); return; }
    if (paso > 0) { paso--; pintar(); return; }
    if (i > 0) { i--; paso = 0; adivino = null; pintar(); }
  }
  function empezarRepaso() { cola = vencidos().slice(0, 5); if (!cola.length) return; modo = "repaso"; qi = -1; respondida = null; $("biblio").hidden = true; pintar(); }

  $("b-adelante").addEventListener("click", adelante);
  $("b-atras").addEventListener("click", atras);
  $("b-repaso").addEventListener("click", empezarRepaso);
  $("lamina").addEventListener("click", async (e) => {
    const g = e.target.closest("[data-g]");
    if (g) { adivino = Number(g.dataset.g); paso = 1; pintar(); return; }
    const r = e.target.closest("[data-r]");
    if (r && !r.disabled) { responderRepaso(Number(r.dataset.r)); return; }
    if (e.target.id === "b-guardar") {
      const c = CARDS[i];
      if (guardados.has(c.id)) guardados.delete(c.id); else guardados.add(c.id);
      guardar("pod-guardados", [...guardados]); pintar(); return;
    }
    if (e.target.id === "b-copiar") {
      const c = CARDS[i];
      const texto = `${c.hook}\n${c.answer}\nThe catch: ${c.catch}\n${c.source.citation}: ${c.source.url}`;
      try { await navigator.clipboard.writeText(texto); $("aviso").textContent = "Copied"; }
      catch { $("aviso").textContent = "Copy did not work here; select the text instead"; }
      return;
    }
    if (e.target.closest("a, button") || modo === "repaso") return;
    if (paso === 0 && CARDS[i].guess) return;
    const rect = $("reel").getBoundingClientRect();
    (e.clientX - rect.left < rect.width / 3 ? atras : adelante)();
  });
  document.addEventListener("keydown", (e) => { if (!$("biblio").hidden) { if (e.key === "Escape") $("biblio").hidden = true; return; } if (e.key === "ArrowRight") { e.preventDefault(); adelante(); } if (e.key === "ArrowLeft") atras(); });
  let x0 = null;
  $("reel").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  $("reel").addEventListener("touchend", (e) => { if (x0 == null || modo === "repaso") return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) (dx < 0 ? adelante : atras)(); x0 = null; });

  function pintarBiblio() {
    const temas = [...new Set(CARDS.map((c) => c.topic))];
    $("cuenta").textContent = `${vistas.size} of ${CARDS.length} read · ${guardados.size} saved`;
    $("filtros").innerHTML = [["", "All"], ["__guardados", "Saved"], ...temas.map((t) => [t, t])].map(([v, n]) => `<button type="button" data-f="${esc(v)}" aria-pressed="${filtro === v}">${esc(n)}</button>`).join("");
    $("lista").innerHTML = CARDS.map((c, k) => [c, k]).filter(([c]) => !filtro || (filtro === "__guardados" ? guardados.has(c.id) : c.topic === filtro)).map(([c, k]) => { const t = TEMAS[c.topic] || TEMAS["AI tutors"]; return `<li><button type="button" data-i="${k}"><span class="barra" style="background:${t.c}"></span><span><span class="t">${k + 1} · ${esc(c.topic)}</span><br><span class="q">${esc(c.hook)}</span></span><span class="visto">${guardados.has(c.id) ? "saved " : ""}${vistas.has(c.id) ? "read" : ""}</span></button></li>`; }).join("") || `<li class="cuenta">Nothing here yet.</li>`;
  }
  $("b-biblio").addEventListener("click", () => { pintarBiblio(); $("biblio").hidden = false; });
  $("b-cerrar").addEventListener("click", () => { $("biblio").hidden = true; });
  $("filtros").addEventListener("click", (e) => { const b = e.target.closest("[data-f]"); if (!b) return; filtro = b.dataset.f; pintarBiblio(); });
  $("lista").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; i = Number(b.dataset.i); paso = 0; adivino = null; modo = "papers"; $("biblio").hidden = true; pintar(); });

  // Instalar en la pantalla de inicio. El usuario no encontraba cómo (2026-10-17):
  // en Android/Chrome el navegador ofrece instalar y el botón lo dispara; en
  // iPhone Safari no deja hacerlo desde la página, así que el botón muestra los
  // dos pasos. Ya instalada (pantalla completa), el botón no aparece.
  const instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let pedido = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); pedido = e; if (!instalada) $("b-instalar").hidden = false; });
  if (!instalada && (ios || /Android/.test(navigator.userAgent))) $("b-instalar").hidden = false;
  $("b-instalar").addEventListener("click", async () => {
    if (pedido) { pedido.prompt(); try { await pedido.userChoice; } catch {} pedido = null; return; }
    $("pasos-instalar").innerHTML = ios
      ? `<ol><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow, at the bottom of the screen).</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><p class="nota">It opens full screen, like an app, and keeps your progress on this phone.</p>`
      : `<ol><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>menu</b> (three dots, top right).</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b>.</li></ol><p class="nota">It opens full screen, like an app, and keeps your progress on this phone.</p>`;
    $("hoja-instalar").hidden = false;
  });
  $("b-cerrar-instalar").addEventListener("click", () => { $("hoja-instalar").hidden = true; });


  // Opening the app with reviews due starts with them; skipping is one tap.
  if (!leer("pod-bienvenida", false) && !vistas.size) { modo = "bienvenida"; pintar(); }
  else if (vencidos().length) empezarRepaso(); else pintar();
})();
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
