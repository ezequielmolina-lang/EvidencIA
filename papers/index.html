<style>
/* A pocket magazine: the question opens on a full-bleed block in its topic's color, then three white pages in heavy black type, the topic color carried into the accents and the chart. Single light look on purpose. */
:root {
  --paper: #ffffff; --ink: #0d0d12; --ink-2: #4a4a55; --rule: #e6e6ec; --wash: #f4f4f7;
  --tema: #2f4bff; --tema-tinta: #ffffff;
  --f-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: #e9e9ee; color: var(--ink); font-family: var(--f-body); margin: 0; -webkit-tap-highlight-color: transparent; }
.escena { height: 100%; display: grid; place-items: center; }
.reel { position: relative; width: min(100vw, calc(100dvh * 9 / 16)); height: 100%; max-height: 100dvh; background: var(--paper); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 10px 50px rgba(13,13,18,.18); transition: background .35s; }
.reel.portada { background: var(--tema); color: var(--tema-tinta); }
.arriba { padding: 14px 18px 0; display: grid; gap: 10px; z-index: 2; }
.segmentos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.segmentos i { height: 4px; border-radius: 2px; background: currentColor; opacity: .18; }
.segmentos i.hecho { opacity: 1; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.num { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; }
.iconos { display: flex; gap: 6px; }
.icono { font: inherit; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: inherit; background: transparent; border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 10px; cursor: pointer; opacity: .8; }
.icono[aria-pressed="true"] { opacity: 1; background: currentColor; }
.icono[aria-pressed="true"] span { color: var(--paper); }
.reel.portada .icono[aria-pressed="true"] span { color: var(--tema); }
.icono:focus-visible, .boton:focus-visible { outline: 3px solid var(--tema); outline-offset: 2px; }
.reel.portada .icono:focus-visible, .reel.portada .boton:focus-visible { outline-color: var(--tema-tinta); }
.lamina { position: relative; z-index: 1; padding: 18px 24px; display: grid; align-content: center; gap: 18px; min-height: 0; overflow-y: auto; animation: entra .4s cubic-bezier(.2,.8,.2,1) both; cursor: pointer; }
@keyframes entra { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.tema { justify-self: start; font-family: var(--f-mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; border: 1.5px solid currentColor; padding: 4px 10px; border-radius: 999px; }
.pregunta { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 9.6vw, 3.25rem); line-height: .98; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.pista { font-family: var(--f-mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.etiqueta { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tema-oscuro, var(--tema)); margin: 0; }
.respuesta { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.65rem, 7vw, 2.3rem); line-height: 1.06; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.respuesta mark { background: linear-gradient(transparent 58%, var(--tema-suave) 58%); color: inherit; }
.historia { font-size: 1.04rem; line-height: 1.55; color: var(--ink-2); margin: 0; }
.cifra-grande { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.6rem); line-height: .9; letter-spacing: -.03em; color: var(--tema-oscuro, var(--tema)); margin: 0; }
.leyenda { font-size: .98rem; line-height: 1.45; margin: 0; font-weight: 700; }
.nota { font-size: .82rem; color: var(--ink-2); line-height: 1.45; margin: 0; }
.trampa { font-size: 1.12rem; line-height: 1.5; margin: 0; }
.recuerda { background: var(--tema); color: var(--tema-tinta); padding: 16px 18px; border-radius: 4px; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; margin: 0; }
.recuerda small { display: block; font-family: var(--f-mono); font-weight: 500; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; opacity: .85; margin-bottom: 6px; }
.fuente { font-size: .88rem; color: var(--ink-2); line-height: 1.6; border-top: 1px solid var(--rule); padding-top: 10px; }
.fuente a { color: var(--ink); font-weight: 700; text-decoration-color: var(--tema); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.tipo { font-weight: 700; color: var(--ink); }
.nivel { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .04em; background: var(--wash); border-radius: 3px; padding: 2px 6px; margin-right: 6px; color: var(--ink); }
svg text { font-family: var(--f-body); }
.abajo { padding: 10px 18px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 2; }
.boton { font: inherit; font-weight: 700; font-size: .95rem; color: inherit; background: transparent; border: 1.5px solid currentColor; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.boton.principal { margin-left: auto; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.reel.portada .boton.principal { background: var(--tema-tinta); color: var(--tema); border-color: var(--tema-tinta); }
.biblioteca { position: absolute; inset: 0; z-index: 5; background: var(--paper); color: var(--ink); display: grid; grid-template-rows: auto 1fr; padding: 16px 18px; }
.biblioteca h2 { font-family: var(--f-display); font-weight: 800; font-size: 2rem; letter-spacing: -.02em; margin: 0; }
.biblioteca ul { list-style: none; padding: 0; margin: 12px 0 0; overflow-y: auto; }
.biblioteca li button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: start; padding: 12px 2px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.biblioteca li button:focus-visible { outline: 3px solid var(--ink); }
.biblioteca .barra { width: 8px; align-self: stretch; border-radius: 2px; }
.biblioteca .q { font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; line-height: 1.2; }
.biblioteca .t { font-family: var(--f-mono); font-size: .68rem; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.biblioteca .visto { font-family: var(--f-mono); font-size: .7rem; color: var(--ink-2); }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cuenta { font-family: var(--f-mono); font-size: .74rem; color: var(--ink-2); margin: 6px 0 0; }
/* Teléfonos bajos (iPhone SE, 667 px): la última lámina se pasaba de 34 a 97 px y casi nadie baja. */
@media (max-height: 740px) {
  .arriba { padding-top: 10px; gap: 6px; }
  .lamina { padding: 10px 20px; gap: 11px; }
  .abajo { padding-top: 6px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .pregunta { font-size: clamp(1.9rem, 8.4vw, 2.6rem); }
  .opcion { padding: 10px 12px; font-size: .95rem; }
  .respuesta { font-size: clamp(1.45rem, 6.2vw, 2rem); }
  .historia, .trampa { font-size: .97rem; line-height: 1.45; }
  .recuerda { font-size: 1.08rem; padding: 12px 14px; }
  .fuente { font-size: .82rem; line-height: 1.45; padding-top: 8px; }
  .red { padding-top: 8px; }
  .chico { padding: 6px 10px; }
  .cifra-grande { font-size: clamp(2.8rem, 13vw, 3.8rem); }
}
@media (prefers-reduced-motion: reduce) { .lamina { animation: none; } .reel { transition: none; } }
.logo { display: inline-flex; align-items: center; gap: 7px; color: inherit; text-decoration: none; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; letter-spacing: -.015em; line-height: 1; white-space: nowrap; }

.logo.chico { font-size: 1.05rem; }

.red p.parte { font-family: var(--f-body); font-size: .86rem; letter-spacing: 0; text-transform: none; color: var(--ink); line-height: 1.45; }

.red a { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: var(--wash); border-radius: 999px; padding: 7px 11px; text-decoration: none; }

.reel.bienvenida { background: #0d0d12; color: #fff; }

.pasos li { font-size: 1.02rem; line-height: 1.4; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }

.racha { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; opacity: .85; }
.opciones { display: grid; gap: 8px; }
.opciones p { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 2px; opacity: .9; }
.opcion { font: inherit; font-weight: 700; font-size: 1rem; text-align: left; color: inherit; background: transparent; border: 1.5px solid currentColor; border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.opcion:hover { background: rgba(255,255,255,.12); }
.opcion:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }

.reel.portada .lamina .opcion { color: var(--tema-tinta); border-color: var(--tema-tinta); }
.opcion.bien { background: #12a150; border-color: #12a150; color: #fff !important; }
.opcion.mal { background: #f4f4f7; border-color: #c9c9d2; color: #4a4a55 !important; text-decoration: line-through; }
.dijiste { font-family: var(--f-mono); font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; margin: 0; padding: 6px 10px; border-radius: 999px; justify-self: start; }

.chico { font: inherit; font-family: var(--f-mono); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); background: var(--wash); border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.chico[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chico:focus-visible { outline: 3px solid var(--tema); outline-offset: 2px; }
.aviso { font-family: var(--f-mono); font-size: .72rem; color: var(--ink-2); }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.reel.repaso { background: var(--ink); color: var(--paper); }

.reel.repaso .explica { font-size: 1.05rem; line-height: 1.5; margin: 0; }
</style>

 each lesson, the 194 students scored 0.63 standard deviations higher after the AI-tutored lesson; no retention was checked."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens to math learning when students practice with ChatGPT and no guardrails?", "answer": "Practice scores rose, but on an exam without AI at the end of the session they scored lower than classmates using books.", "story": "In one large high school in Ankara, Turkey, about 50 math classes (839 students) were randomly assigned. Some practiced with an open GPT-4 chat tutor; others used books and notes, no devices. Across four 90-minute sessions in fall 2023, the AI group did better during practice but worse on a closed-book exam that ended each session.", "chart": {"type": "bars", "unit": "% vs. control group average", "bars": [{"label": "Practice, AI open", "value": 48}, {"label": "Exam, no AI", "value": -17}]}, "caption": "Change versus the control group's average score: practice with AI open vs. exam without AI", "catch": "The exam came at the end of the same 90-minute session, with problems very like the practice; no later test. One school, a 2023 model, and the authors built the tutor.", "takeaway": "Unguided AI help that gives answers can boost practice scores while lowering what students can do alone.", "topic": "ChatGPT & learning", "source": {"citation": "Bastani et al., 2025", "url": "https://doi.org/10.1073/pnas.2422633122", "page": "p. 11"}, "country": "Turkey", "year": 2025, "id": "bastani-turquia-2025-sin-guia", "guess": {"prompt": "Practice with open ChatGPT vs. books: what happened to math scores?", "options": ["No real change in practice or exam", "Higher in practice and on the exam", "Higher in practice, lower on the exam"], "correct": 2}, "recall": {"prompt": "In the Ankara high school trial with open GPT-4, how did the AI group do on the closed-book exam?", "options": ["About the same as the books group", "About 17% lower than the books group", "About 48% higher than the books group"], "correct": 1, "explain": "Practice scores rose 48%, but on the closed-book exam ending each session the AI group scored 17% below the books group."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when Ghanaian students get a math tutor on WhatsApp, an hour a week?", "answer": "From February to August 2023, they gained about 3 more correct answers out of 35 on a math test than students without it.", "story": "Researchers randomly assigned 11 schools in Ghana's Rising Academies network. In 5, students in grades 3 to 8 used Rori, a WhatsApp math tutor, on a school phone for two 30-minute sessions a week, on top of normal math class. Their test scores grew 0.36 standard deviations more than those of students in the 6 comparison schools.", "chart": {"type": "bars", "unit": "points gained (correct answers out of 35)", "bars": [{"label": "Without Rori", "value": 2.12}, {"label": "With Rori", "value": 5.13}]}, "caption": "Average score growth on a 35-question math test, February to August 2023", "catch": "Rori isn't generative AI: lessons are prewritten. It comes from the same school network as one author, only 11 schools took part, and 25% of students missed the final test.", "takeaway": "A prewritten WhatsApp math tutor, used an hour a week at school, lifted Ghanaian students' math scores.", "topic": "Adaptive practice", "source": {"citation": "Henkel, Horne-Robinson, Kozhakhmetova, Lee, 2024", "url": "https://doi.org/10.1007/978-3-031-64315-6_34", "page": "p. 5"}, "country": "Ghana", "year": 2024, "id": "ghana-rori-2024", "guess": {"prompt": "After six months of the WhatsApp tutor, how did their math scores compare?", "options": ["No real difference from other students", "Slightly lower than other students", "About 3 more correct answers out of 35"], "correct": 2}, "recall": {"prompt": "In the Ghana trial of Rori, a prewritten WhatsApp math tutor used an hour a week, how did students' math scores change?", "options": ["They grew about the same as students without it", "They gained about 3 more correct answers out of 35", "They fell behind students without the tutor"], "correct": 1, "explain": "Students using Rori gained 5.13 points versus 2.12 without it, about 3 more correct answers out of 35."}, "kind": "A rigorous randomized trial"}, {"hook": "Can an AI that whispers tips to human tutors help kids do better in math?", "answer": "A little, on short quizzes in the same session: pass rates rose from 62% to 66%, but there was no clear effect on the year-end test.", "story": "In 9 schools in a southern U.S. district, about 900 online math tutors of students in grades 3 to 6 were randomly split for about 7 weeks. Half had a button that suggested how to respond, such as a hint or a worked example. Their students passed more end-of-session quizzes, especially with lower-rated tutors.", "chart": {"type": "bars", "unit": "% passing the end-of-session quiz", "bars": [{"label": "Tutors without AI", "value": 62}, {"label": "Tutors with AI", "value": 66}, {"label": "Lower-rated tutors, no AI", "value": 56}, {"label": "Lower-rated tutors, with AI", "value": 65}]}, "caption": "Share of students passing the end-of-session quiz, by tutor group", "catch": "The gain is on the platform's own quick quiz, not the year-end test. The authors built the tool, tutors used it in only 29% of sessions, and it's not peer reviewed.", "takeaway": "AI suggestions helped tutors, especially weaker ones, on same-day quizzes. Lasting learning gains were not shown.", "topic": "Teachers & AI", "source": {"citation": "Wang, Ribeiro, Robinson, Loeb & Demszky, 2025", "url": "https://arxiv.org/pdf/2410.03017v3", "page": "p. 10"}, "country": "United States", "year": 2025, "id": "tutor-copilot-eeuu-2025", "guess": {"prompt": "With AI tips for tutors, what happened to students' math results?", "options": ["No change, or slightly worse results", "Clear gains on quizzes and the year-end test", "Small quiz gain, no clear year-end test effect"], "correct": 2}, "recall": {"prompt": "In the U.S. Tutor CoPilot trial, where AI suggested replies to online math tutors, whose students gained most?", "options": ["Students of lower-rated tutors", "All students gained about equally", "Students of top-rated tutors"], "correct": 0, "explain": "With lower-rated tutors, quiz pass rates rose from 56% to 65%, a bigger jump than the overall rise from 62% to 66%."}, "kind": "A rigorous randomized trial"}, {"hook": "How much does a reading app help six-year-olds who are falling behind?", "answer": "Overall the gain was too small to rule out chance; for children from low-income families it was clearer.", "story": "In 57 schools in England, the 12 weakest readers aged 6 to 7 in each school were randomly split. Half used Lexia Core5, an adaptive reading program, in 30-minute sessions four times a week for 24 weeks on top of regular lessons; half had regular lessons only. The app group scored slightly higher, but the gap could be chance.", "chart": {"type": "effect", "value": 0.08, "low": -0.03, "high": 0.18, "label": "Overall reading score (WRMT-III composite), in standard deviations"}, "caption": "Overall effect: 0.08 standard deviations, with a range that crosses zero (no clear effect)", "catch": "Not generative AI: prewritten content. The overall effect wasn't statistically significant; the clearer 0.18 standard deviation gain for low-income children comes from a subgroup, and the paper's conclusion sounds more positive than that.", "takeaway": "A year of extra app practice didn't clearly lift struggling young readers overall; low-income children may gain more.", "topic": "Reading", "source": {"citation": "Cockerill et al., 2024", "url": "https://doi.org/10.1016/j.appdev.2024.101726", "page": "p. 9"}, "country": "United Kingdom", "year": 2024, "id": "inglaterra-lexia-core5-2024", "guess": {"prompt": "After 24 weeks of extra app practice, how did the weakest readers do?", "options": ["They clearly read better than those without it", "They fell behind the group without the app", "Slightly better, but the gap could be chance"], "correct": 2}, "recall": {"prompt": "In the England Lexia Core5 trial with struggling six-year-olds, which children gained most clearly?", "options": ["No group showed a clear gain", "Children who used the app the most hours", "Children from low-income families"], "correct": 2, "explain": "Overall the 0.08 standard deviation gain could be chance, but low-income children gained a clearer 0.18 standard deviations."}, "kind": "A rigorous randomized trial"}, {"hook": "Which makes a science text stick: mapping it, or writing down what you recall?", "answer": "Writing down what you recall. A week later, students who practiced recall got 67% right, versus 45% for those who made concept maps.", "story": "US college students read a science text in one lab session. Some repeatedly wrote down everything they remembered; others built a concept map with the text in view, for the same total time. A week later, on short-answer questions, recall practice won, including on inference questions and even when the test was drawing a concept map.", "chart": {"type": "bars", "unit": "% of answers correct", "bars": [{"label": "Practiced recall", "value": 67}, {"label": "Made a concept map", "value": 45}]}, "caption": "Short-answer questions answered correctly one week later, Experiment 1", "catch": "One lab session with US college students and a researcher-made quiz a week later. The main gap, 1.5 standard deviations, compares two of the four groups in the first experiment.", "takeaway": "Trying to recall what you read beats concept mapping with the text open, even though most students expect otherwise.", "topic": "Learning science", "source": {"citation": "Karpicke & Blunt, 2011", "url": "https://learninglab.psych.purdue.edu/downloads/2011/2011_Karpicke_Blunt_Science.pdf", "page": "p. 3"}, "country": "United States", "year": 2011, "id": "recuperacion-karpicke-2011", "guess": {"prompt": "Which method left students remembering more a week later?", "options": ["Writing down what you recall", "About the same either way", "Making a concept map"], "correct": 0}, "recall": {"prompt": "In the 2011 US college study on learning a science text, how did recall practice compare with concept mapping?", "options": ["No real difference between them", "Recall won: 67% right vs. 45% for maps", "Maps won: 67% right vs. 45% for recall"], "correct": 1, "explain": "A week later, recall practice got 67% right versus 45% for concept mapping, though most students expected maps to work as well or better."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "How many teachers believe students learn best in their own 'learning style'?", "answer": "Most of them: across 37 survey samples, 89.1% of educators agreed with this popular neuromyth.", "story": "Researchers pooled 33 studies (37 samples) surveying 15,405 educators in 18 countries, published from 2009 to early 2020. Across samples, belief that teaching should match a student's preferred style ranged from 58% to 97.6%. In four studies, training that explained the lack of evidence lowered belief from 78.4% to 37.1%.", "chart": {"type": "bars", "unit": "% who believe", "bars": [{"label": "All educators (34 samples)", "value": 89.1}, {"label": "Teachers in training", "value": 95.4}, {"label": "Qualified teachers", "value": 87.8}]}, "caption": "Share believing in style matching; the trainee vs qualified gap could be chance", "catch": "Self-reported beliefs from convenience samples, none representative. In 2 small studies where the idea was explained first, belief was 63.5%.", "takeaway": "Belief in matching teaching to learning styles is widespread among educators, and explaining the evidence may reduce it.", "topic": "Myths", "source": {"citation": "Newton & Salvi, 2020", "url": "https://www.frontiersin.org/journals/education/articles/10.3389/feduc.2020.602451/pdf", "page": "p. 1"}, "country": "18 countries (including UK, US, China, Peru, Chile, Argentina)", "year": 2020, "id": "estilos-newton-2020", "guess": {"prompt": "How many educators believe students learn best in their own learning style?", "options": ["Roughly half", "A small minority", "Most of them"], "correct": 2}, "recall": {"prompt": "In Newton & Salvi's 2020 review of teacher surveys, what did training on the missing evidence do to belief?", "options": ["Belief fell from 78.4% to 37.1%", "Belief went up", "Belief barely changed"], "correct": 0, "explain": "In four studies, training that explained the lack of evidence lowered belief in learning-style matching from 78.4% to 37.1%."}, "kind": "A review of surveys of educators"}, {"hook": "What happens to final exam scores when a class allows laptops and tablets?", "answer": "At West Point, classes that allowed laptops or tablets scored 0.18 standard deviations lower on the final exam than device-free ones.", "story": "Researchers randomly assigned 50 economics classrooms at the US Military Academy (West Point), with 726 second-year students. Classes either allowed laptops and tablets freely, allowed only tablets lying flat on the desk, or banned devices. Both device groups scored lower on the end-of-semester final exam than device-free classes. Essay questions showed no clear difference.", "chart": {"type": "effect", "value": -0.18, "low": null, "high": null, "label": "Final exam score (multiple choice and short answer), devices allowed vs. no devices", "caption": "Classes allowing devices scored 0.18 SD lower, about 1.7 points on a 100-point exam."}, "catch": "It tested allowing devices, not using them, so the cause is unknown: distraction, worse notes or teacher changes. West Point is highly selective and military, and only one economics course was studied.", "takeaway": "In this trial, allowing laptops or tablets for note-taking lowered multiple-choice and short-answer exam scores.", "topic": "Screens & phones", "source": {"citation": "Carter, Greenberg & Walker, 2017", "url": "https://doi.org/10.1016/j.econedurev.2016.12.005", "page": "p. 1"}, "country": "United States", "year": 2017, "id": "computadoras-carter-2017", "guess": {"prompt": "When a class allows laptops and tablets, what happens to final exam scores?", "options": ["No real change", "Scores went up", "Scores went down"], "correct": 2}, "recall": {"prompt": "In the West Point economics trial, what happened in classes that allowed only tablets lying flat on the desk?", "options": ["They scored about the same as device-free classes", "They scored higher than device-free classes", "They scored lower than device-free classes"], "correct": 2, "explain": "Even flat tablets visible to the teacher lowered final exam scores, by 0.17 standard deviations compared with device-free classes."}, "kind": "A rigorous randomized trial"}, {"hook": "How many AI-written exam answers would university markers actually catch?", "answer": "Very few: 94% of 63 GPT-4 exam submissions went unflagged, and they typically outscored real students.", "story": "In summer 2023, researchers at the University of Reading (UK) secretly submitted 63 take-home exam answers written by GPT-4, almost unedited, under fake student names in five Psychology modules, without telling markers. Only 4 were flagged, and only 16% of real students' submissions beat the AI's median grade. The final-year module, with just 3 AI answers, was the exception.", "chart": {"type": "bars", "unit": "AI exam submissions (out of 63)", "bars": [{"label": "Not flagged", "value": 59}, {"label": "Flagged for any reason", "value": 4}, {"label": "Flagged mentioning AI", "value": 2}]}, "caption": "Of 63 GPT-4 exam submissions, how many human markers flagged as suspicious", "catch": "One department, one university, one exam season, small sample. Real students could also use AI at home, and no AI detector software was tested. It measures detection and grades, not learning.", "takeaway": "In unsupervised take-home exams, unedited GPT-4 answers mostly slipped past markers and often earned good grades.", "topic": "ChatGPT & learning", "source": {"citation": "Scarfe, Watcham, Clarke & Roesch, 2024", "url": "https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0305354&type=printable", "page": "p. 1"}, "country": "United Kingdom", "year": 2024, "id": "integridad-scarfe-2024", "guess": {"prompt": "Of 63 secret GPT-4 exam answers, how many did markers flag?", "options": ["Most of them were flagged", "About half were flagged", "Very few were flagged"], "correct": 2}, "recall": {"prompt": "In the Reading University test with 63 secret GPT-4 exam answers, how did AI grades compare with students'?", "options": ["They scored about the same", "The AI typically scored lower", "The AI typically scored higher"], "correct": 2, "explain": "Only 16% of real students' submissions beat the AI's median grade; the final-year module was the exception."}, "kind": "A real-world test inside one university"}, {"hook": "What happens to students when their teachers plan lessons with a ChatGPT-style AI?", "answer": "Average exam scores held steady, but students reported less interest, and students of weaker teachers scored lower.", "story": "In 14 schools in Turkey, teachers of grades 5 to 12 were randomly given a GPT-4o lesson-planning assistant or their usual training for one semester. Their students later reported less interest and enjoyment in the subject. Exam scores didn't change on average, but fell 0.129 standard deviations among students of teachers with lower prior performance.", "chart": {"type": "effect", "value": -0.019, "low": -0.088, "high": 0.05, "label": "end-of-semester standardized exam scores"}, "caption": "Effect on exam scores in standard deviations, with 95% range: no clear effect, close to zero", "catch": "Working paper, not peer reviewed, and the authors built the tool. Motivation came from one end-of-semester survey with no baseline. That drop shrank with statistical controls. Exam scores were near ceiling.", "takeaway": "Giving teachers an AI planning tool didn't raise scores here, and may have dampened students' interest.", "topic": "Teachers & AI", "source": {"citation": "Sungu, Lira & Duckworth, 2026", "url": "https://ssrn.com/abstract=7007339", "page": "p. 7"}, "country": "Turkey", "year": 2026, "id": "turquia-docentes-ia-2026", "guess": {"prompt": "Teachers got an AI lesson planner. What happened to their students?", "options": ["Scores fell, but interest held steady", "Scores rose and interest grew", "Scores held steady, but interest fell"], "correct": 2}, "recall": {"prompt": "In the Turkish trial where teachers planned lessons with GPT-4o, what happened to students of weaker teachers?", "options": ["Their exam scores fell", "Their exam scores rose", "Their exam scores didn't change"], "correct": 0, "explain": "Average scores held steady, but students of teachers with lower prior performance scored 0.129 standard deviations lower."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when a whole country tries to scale up a reading program?", "answer": "Kenya reached 23,000 schools, and more second graders met reading goals a year later, though without a control group.", "story": "Kenya's Tusome program gave teachers structured lesson guides, one book per child, training and coaching by government supervisors, in 23,000 public primary schools. An external evaluation compared national samples of grade 1 and 2 pupils in 2015 and 2016. Over that year, reading scores rose, and almost every classroom got its guides and books.", "chart": {"type": "bars", "unit": "% of grade 2 pupils meeting the reading benchmark", "bars": [{"label": "English 2015", "value": 34}, {"label": "English 2016", "value": 65}, {"label": "Kiswahili 2015", "value": 37}, {"label": "Kiswahili 2016", "value": 66}]}, "caption": "Grade 2 pupils meeting Kenya's reading benchmark, 2015 vs 2016 (before-after, no control group)", "catch": "Before-and-after comparison with no control group, so not proof of cause. Authors led or coordinated the program; the learning figures come from an external evaluation. First-year results, simple oral reading tests.", "takeaway": "A tested reading model reached classrooms nationwide via the public system; this study can't show it caused the gains.", "topic": "Reading", "source": {"citation": "Piper et al., 2018", "url": "https://link.springer.com/content/pdf/10.1007/s10833-018-9325-4.pdf", "page": "p. 19"}, "country": "Kenya", "year": 2018, "id": "lectura-tusome-piper-2018", "guess": {"prompt": "A year into Kenya's nationwide program, how did second graders do in reading?", "options": ["No real change", "More met the reading goals", "Fewer met the reading goals"], "correct": 1}, "recall": {"prompt": "In Kenya's Tusome reading program, how did grade 2 pupils meeting the English benchmark change from 2015 to 2016?", "options": ["Stayed around 34%", "Fell from 65% to 34%", "Rose from 34% to 65%"], "correct": 2, "explain": "Grade 2 pupils meeting the English benchmark rose from 34% to 65%, but with no control group this doesn't prove Tusome caused it."}, "kind": "A before-and-after study, not cause and effect"}, {"hook": "What happened when Nigerian teens used a chatbot as an after-school English tutor?", "answer": "Their English scores rose by 0.238 of a standard deviation, but the boost mixes the AI with extra study time and teacher supervision.", "story": "In 9 public schools in Benin City, 1,328 volunteer students around 15 were drawn by lottery. Those picked got up to 12 after-school sessions over six weeks, in pairs, using Microsoft Copilot prompted by teachers to guide, not give answers. Compared with peers in regular classes only, they scored higher on an English test built for the study.", "chart": {"type": "effect", "value": 0.238, "low": 0.1, "high": 0.37, "label": "English score on the study's end-of-program test (standard deviations)"}, "caption": "Effect in standard deviations, with 95% range (0.1 to 0.37); zero would mean no difference", "catch": "Only 64% of the AI group and 50% of the comparison group took the final test, and no group got extra time without AI. The World Bank team designed and evaluated it; not peer reviewed.", "takeaway": "Supervised after-school sessions with an AI tutor raised English scores, but we can't separate the AI from the extra time.", "topic": "AI tutors", "source": {"citation": "De Simone et al., 2025", "url": "https://documents.worldbank.org/curated/en/099548105192529324/pdf/IDU-c09f40d8-9ff8-42dc-b315-591157499be7.pdf", "page": "p. 14"}, "country": "Nigeria", "year": 2025, "id": "nigeria-edo-2025", "guess": {"prompt": "After six weeks of AI tutoring, what happened to their English scores?", "options": ["No real change", "They went down", "They went up"], "correct": 2}, "recall": {"prompt": "In the Nigerian after-school trial with Microsoft Copilot, why can't the English gain be credited to the AI alone?", "options": ["No group got extra study time without the AI", "Only teachers used the chatbot, not students", "The test was taken with the AI allowed"], "correct": 0, "explain": "Students got AI plus extra after-school time and teacher supervision; English scores rose 0.238 standard deviations, but no group had extra time without AI."}, "kind": "A rigorous randomized trial"}, {"hook": "When learners can ask an AI for the answer anytime, do they learn more or less?", "answer": "Less. Chess players with an on-demand best-move button improved less than half as much as those helped only when the system chose.", "story": "Over 12 weeks of home training, 216 club chess players in Greece, Cyprus and Kenya practised against a chess engine that flagged critical moments. Half could also press a button for the best move anytime. In unassisted test games, the button group improved 30% from their starting score, versus 64% for the others, and trained less.", "chart": {"type": "bars", "unit": "% improvement", "bars": [{"label": "Help on demand", "value": 30}, {"label": "Help when the system chose", "value": 64}]}, "caption": "Improvement in unassisted test games over each group's starting score, after 12 weeks", "catch": "Chess, not school: a rule-based engine, not generative AI. Both groups had AI help; assignment rotated by coach, not by lottery. Not peer reviewed, and the authors built the platform and tests.", "takeaway": "In chess training, help on demand led to less learning than help given only at moments the system chose.", "topic": "Learning science", "source": {"citation": "Poulidis, Bastani & Bastani, 2025", "url": "https://doi.org/10.2139/ssrn.5604932", "page": "p. 3"}, "country": "Greece, Cyprus, Kenya", "year": 2025, "id": "ajedrez-ia-autorregulada-2025", "guess": {"prompt": "Did chess players with an anytime best-move button learn more or less?", "options": ["They learned less", "They learned more", "About the same"], "correct": 0}, "recall": {"prompt": "In the 12-week chess trial in Greece, Cyprus and Kenya, how did players with an anytime best-move button do?", "options": ["Improved 64%, vs 30% for the other group", "Improved 30%, vs 64% for the other group", "Improved about the same as the other group"], "correct": 1, "explain": "Players with an anytime best-move button improved 30% in unassisted test games, versus 64% for those helped only when the system chose."}, "kind": "A trial assigned by coach, not by lottery"}, {"hook": "What happened when Delhi students got after-school time with adaptive learning software?", "answer": "They scored higher in both math and Hindi after 4.5 months, though the program mixed software, an instructor and extra study time.", "story": "In Delhi, 619 public-school students, mostly in grades 6 to 9, applied for after-school Mindspark centers. A lottery gave 314 a free voucher and 305 did not. Sessions ran 90 minutes, six days a week, for 4.5 months: half on adaptive software, half in instructor-led groups. Winners scored 0.37 standard deviations higher in math and 0.23 in Hindi.", "chart": {"type": "effect", "value": 0.369, "low": 0.24, "high": 0.49, "label": "Math test score gain, in standard deviations"}, "caption": "Math gain for lottery winners vs. non-winners, in standard deviations, with its 95% range", "catch": "Not generative AI: pre-written adaptive content. The gain bundles software, a daily instructor and extra study time. Average attendance was 58%, and the centers closed soon after because few families would pay.", "takeaway": "Extra after-school time mixing adaptive practice and an instructor raised math and Hindi scores for Delhi students.", "topic": "Adaptive practice", "source": {"citation": "Muralidharan, Singh & Ganimian, 2019", "url": "https://doi.org/10.1257/aer.20171112", "page": "p. 38"}, "country": "India", "year": 2019, "id": "india-mindspark-2019", "guess": {"prompt": "After 4.5 months, how did lottery winners' test scores compare?", "options": ["Higher in both math and Hindi", "No real change in either subject", "Higher in math, no change in Hindi"], "correct": 0}, "recall": {"prompt": "In the Delhi trial of after-school Mindspark centers, how did the math gain compare with the Hindi gain?", "options": ["Math gained more than Hindi", "Hindi gained more than math", "The gains were about equal"], "correct": 0, "explain": "Lottery winners scored 0.37 standard deviations higher in math and 0.23 higher in Hindi after 4.5 months."}, "kind": "A rigorous randomized trial"}, {"hook": "Can tutoring reach more students if software covers half the sessions?", "answer": "Yes, in this trial: ninth graders offered the program scored higher in math, by 0.19 standard deviations, a moderate effect.", "story": "3,846 ninth graders in public high schools in Chicago and New York were randomly offered a daily 50-minute math period for a school year. Groups of four alternated days with a human tutor and days on ALEKS practice software. Compared with students in usual classes, those offered it scored higher on official end-of-year math tests.", "chart": {"type": "effect", "value": 0.19, "low": 0.12, "high": 0.26, "label": "End-of-year standardized math score (cohort 1)"}, "caption": "A moderate effect: an average student would move from 50th to 58th place out of 100", "catch": "Not generative AI: ALEKS uses prewritten content, and half the time is a human tutor, so the software's own share is unknown. Working paper, not peer reviewed; test scores only from 2018-19.", "takeaway": "Pairing a human tutor with adaptive practice software in small groups raised ninth-grade math scores.", "topic": "Cost & scale", "source": {"citation": "Bhatt et al., 2024", "url": "https://www.nber.org/papers/w32510", "page": "p. 54"}, "country": "United States", "year": 2024, "id": "eeuu-saga-tutoria-tecnologia-2024", "guess": {"prompt": "What happened to math scores when software covered half the tutoring days?", "options": ["Math scores rose moderately", "Math scores went down", "No real change in math scores"], "correct": 0}, "recall": {"prompt": "In the Chicago and New York trial pairing tutors with ALEKS software, how did ninth graders' math scores change?", "options": ["No measurable change", "Rose moderately, about 0.19 SD", "They dropped slightly"], "correct": 1, "explain": "Students offered the program scored 0.19 standard deviations higher on official end-of-year math tests, moving an average student from 50th to 58th."}, "kind": "A rigorous randomized trial"}, {"hook": "How did a phonics computer game compare with usual help for young struggling readers?", "answer": "About the same: children who played it read and spelled no better or worse than classmates who got their usual reading support.", "story": "In 15 schools in England, 398 Year 2 children who were behind in phonics were assigned by lottery: 200 played GraphoGame Rime 10 to 15 minutes a day for a term, and 198 kept their usual reading help. On a standard reading test, both groups ended up about the same. Spelling showed the same pattern.", "chart": {"type": "effect", "value": -0.06, "low": -0.23, "high": 0.12, "label": "Reading test score, in standard deviations (97% confidence interval)"}, "caption": "Effect on reading: -0.06 standard deviations. The range includes zero, so no clear effect.", "catch": "Children played less than recommended (6 hours on average the first year vs 8.3 to 12.5), and the trial can't tell small effects from zero. It's a pre-written adaptive game, not generative AI.", "takeaway": "For struggling Year 2 readers, this phonics game did about as well as usual reading help, not better.", "topic": "Reading", "source": {"citation": "Worth et al., 2018", "url": "https://d2tic4wvo1iusb.cloudfront.net/production/documents/projects/GraphoGame_Rime.pdf?v=1792060816", "page": "p. 24"}, "country": "United Kingdom", "year": 2018, "id": "lectura-graphogame-eef-2018", "guess": {"prompt": "Did kids who played the phonics game read better than with usual help?", "options": ["About the same as usual help", "No, they read clearly worse", "Yes, they read clearly better"], "correct": 0}, "recall": {"prompt": "In the England trial of the GraphoGame Rime phonics game, how did reading compare with usual help?", "options": ["Game children read clearly worse", "Game children read clearly better", "About the same as usual reading help"], "correct": 2, "explain": "The effect on reading was -0.06 standard deviations, with a range including zero, so the game did no better than usual help."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when math practice mixes problem types instead of grouping them?", "answer": "Seventh graders who practiced mixed problems scored 61% on a surprise test a month later, versus 38% for those who practiced in blocks.", "story": "54 seventh-grade math classes in Florida (787 students) were randomly assigned to four months of practice sheets with problem types either mixed or grouped by type. On a surprise test a month later, the mixed group scored higher by 0.83 standard deviations, and the gain appeared with each of the 15 teachers.", "chart": {"type": "bars", "unit": "% correct", "bars": [{"label": "Mixed practice", "value": 61}, {"label": "Blocked practice", "value": 38}]}, "caption": "Share of correct answers on a surprise test about one month after the final review sheet", "catch": "Mixed practice took more time, and time wasn't measured, so the gain per minute is likely smaller. The researchers built the test, using the same four problem types students practiced.", "takeaway": "Mixing math problem types during practice, with corrections, helped seventh graders solve them a month later.", "topic": "Learning science", "source": {"citation": "Rohrer, Dedrick, Hartwig & Cheung, 2020", "url": "https://files.eric.ed.gov/fulltext/ED595322.pdf", "page": "p. 2"}, "country": "United States", "year": 2020, "id": "intercalado-rohrer-2020", "guess": {"prompt": "On a surprise test a month later, how did the mixed-practice students do?", "options": ["About the same as blocked practice", "Better than blocked practice", "Worse than blocked practice"], "correct": 1}, "recall": {"prompt": "In the Florida seventh-grade math trial, how did mixed practice do on the surprise test a month later?", "options": ["61% correct, versus 38% for blocked practice", "38% correct, versus 61% for blocked practice", "No real difference between the two groups"], "correct": 0, "explain": "Mixed practice scored 61% versus 38% for blocked practice, and the gain appeared with each of the 15 teachers."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when 'auditory' and 'visual' learners get lessons in their preferred style?", "answer": "Nothing special: matching the format to people's preferred style did not improve how much they understood.", "story": "Researchers in the United States measured whether college-educated adults preferred listening or reading. They then randomly gave each person the same nonfiction book as an audiobook or as an e-text, testing comprehension right away and 2 weeks later. Style and format did not interact. People who preferred visual words understood better either way.", "chart": null, "caption": "No chart: the abstract reports no scores or statistics, only that the match made no clear difference.", "catch": "This summary relies on the abstract and the authors' later description. Sample size and statistics could not be checked, so a small sample might hide an effect. One session, adults only.", "takeaway": "Giving adults lessons in their preferred 'learning style' did not help them understand more.", "topic": "Myths", "source": {"citation": "Rogowsky, Calhoun & Tallal, 2015", "url": "https://doi.org/10.1037/a0037478", "page": "p. 1"}, "country": "United States", "year": 2015, "id": "estilos-rogowsky-2015", "guess": {"prompt": "Did matching lessons to people's preferred style help them understand more?", "options": ["They understood less when matched", "No real difference in understanding", "Yes, they understood clearly more"], "correct": 1}, "recall": {"prompt": "In the US adult study giving a book as audiobook or e-text by learning style, what did matching do?", "options": ["Made no clear difference to comprehension", "Helped auditory learners only", "Boosted comprehension, mostly at 2 weeks"], "correct": 0, "explain": "Matching format to preferred style didn't help; people who preferred visual words understood better with either audiobook or e-text."}, "kind": "A randomized lab experiment, with limits"}, {"hook": "When schools ban phones, which students actually gain?", "answer": "The average gain could have been chance, but students who started furthest behind clearly gained the most.", "story": "Researchers followed 130,482 students in 91 state secondary schools in Birmingham, Leicester, London and Manchester, 2001 to 2011. Schools banned phones in different years, so they compared exam progress at 16 before and after each school's ban. The average gain could have been chance; students in the bottom fifth by age-11 scores gained 0.1423 standard deviations.", "chart": {"type": "effect", "value": 0.1423, "low": null, "high": null, "label": "Exam progress at 16 after a phone ban, students in the bottom fifth by age-11 scores"}, "caption": "Extra exam gain after a ban for the lowest-achieving fifth, in standard deviations", "catch": "Not a randomized trial: schools chose when to ban, and principals recalled dates in a 2013 survey. Results run 2001 to 2011, mostly before smartphones, and come from the 2015 working paper.", "takeaway": "Phone bans showed no clear average gain here, but students who were behind seemed to benefit most.", "topic": "Screens & phones", "source": {"citation": "Beland & Murphy, 2016", "url": "https://cep.lse.ac.uk/pubs/download/dp1350.pdf", "page": "p. 14"}, "country": "United Kingdom", "year": 2016, "id": "celulares-beland-2016", "guess": {"prompt": "When schools banned phones, which students gained the most?", "options": ["Students who started furthest behind", "The top-scoring students", "All students gained about equally"], "correct": 0}, "recall": {"prompt": "In the English phone-ban study of 91 schools (2001–2011), what happened to average exam progress?", "options": ["A gain that could have been chance", "A clear, solid gain for everyone", "A clear drop in exam results"], "correct": 0, "explain": "The average gain could have been chance, but students in the bottom fifth by age-11 scores gained 0.1423 standard deviations."}, "kind": "A natural experiment, not randomized"}, {"hook": "What happens when AI-writing detectors read essays written in a second language?", "answer": "Seven detectors wrongly flagged 61.3% of TOEFL essays by humans as AI, on average, but judged US eighth graders' essays almost perfectly.", "story": "Researchers ran 91 TOEFL essays by non-native English writers, taken from a Chinese forum, and 88 essays by US eighth graders through seven widely used AI detectors in 2023. More than half the TOEFL essays were wrongly flagged as AI. When ChatGPT enriched those same essays' vocabulary, the false-flag rate fell from 61.3% to 11.6%.", "chart": {"type": "bars", "unit": "% of human-written essays wrongly flagged as AI", "bars": [{"label": "TOEFL essays as written", "value": 61.3}, {"label": "Same essays, vocabulary enriched by ChatGPT", "value": 11.6}]}, "caption": "Average share of human-written TOEFL essays that seven detectors labeled AI-generated", "catch": "A short opinion piece summarizing 2023 tests, with no record of peer review. The samples are small, and the two essay groups differ in more than native language. Detectors change, and real-world accusations weren't measured.", "takeaway": "AI-writing detectors can wrongly flag non-native writers' own work. Simpler vocabulary seems to trigger them.", "topic": "Teachers & AI", "source": {"citation": "Liang, Yuksekgonul, Mao, Wu, Zou, 2023", "url": "https://pmc-oa-opendata.s3.amazonaws.com/PMC10382961.1/PMC10382961.1.pdf", "page": "p. 1"}, "country": "United States, China", "year": 2023, "id": "deteccion-liang-2023", "guess": {"prompt": "How often did the detectors wrongly flag the human-written TOEFL essays as AI?", "options": ["Rarely; most were judged human", "More than half, on average", "Sometimes, but well under half"], "correct": 1}, "recall": {"prompt": "In the 2023 test of seven AI detectors on TOEFL essays, what happened when ChatGPT enriched the essays' vocabulary?", "options": ["Wrong AI flags went up", "Wrong AI flags dropped sharply", "No real change in wrong AI flags"], "correct": 1, "explain": "Richer vocabulary cut the average false-flag rate from 61.3% to 11.6%, suggesting simpler wording triggers the detectors."}, "kind": "A test of AI detectors"}, {"hook": "Can you learn a new alphabet just by practice, or do you need the rules explained?", "answer": "In this lab study, about 30 minutes of explaining the rules let nearly all adults read new words. Practice alone worked for few.", "story": "In London, 48 university adults spent 10 days learning 48 made-up words written in two unfamiliar alphabets. One group first got about 30 minutes on how symbols map to sounds and meanings. The other had to discover the patterns through practice with feedback. Both learned the practised words; the difference was reading new ones.", "chart": {"type": "bars", "unit": "participants", "bars": [{"label": "Discovery group (no rules explained)", "value": 24}, {"label": "Of them, could read and understand new words", "value": 5}]}, "caption": "Discovery group: only 5 of 24 could generalize, while virtually all in the explicit group could.", "catch": "Adult university students, not children, learning invented alphabets in a lab. Groups were small (24 each), random assignment isn't reported, and testing happened only at the end of training.", "takeaway": "A short, explicit explanation of how symbols map to sounds helped adults read words they had never seen.", "topic": "Reading", "source": {"citation": "Rastle et al., 2021", "url": "https://doi.org/10.1177/0956797620968790", "page": "p. 11"}, "country": "United Kingdom", "year": 2021, "id": "lectura-rastle-2021", "guess": {"prompt": "30 minutes of rules vs. practice alone: who could read new words?", "options": ["Practice alone worked better", "Both groups did about the same", "Nearly all who got the rules explained"], "correct": 2}, "recall": {"prompt": "In the London lab study of adults learning invented alphabets, how many in the practice-only group read new words?", "options": ["None of them", "Only 5 of 24", "Nearly all of them"], "correct": 1, "explain": "Only 5 of 24 practice-only adults generalized, while virtually all who got about 30 minutes of rules explained could read new words."}, "kind": "A small lab experiment"}, {"hook": "What helps students more: being nudged to use AI, or being shown how to use it?", "answer": "Being shown how. Emails on using the AI as a step-by-step tutor raised final exam grades; simply encouraging use did not.", "story": "About 300 third-year econometrics students at a Chilean university all had the same course AI assistant. Randomly chosen students got emails: first encouragement to use it (no clear effect), then, before the final, ready-to-copy prompts making it a step-by-step tutor. Their final exam grades rose 0.22 standard deviations (about 3.5 points out of 100) and pass rates 12.8 percentage points.", "chart": {"type": "effect", "value": 0.217, "low": 0.02, "high": 0.41, "label": "Final exam grade, tutor-style guidance vs. no emails (standard deviations)"}, "caption": "Effect of the guidance emails on final exam grades, in standard deviations, with 95% range", "catch": "Not peer reviewed; the author built the tool and ran the study at his own university. One course, short horizon: emails came days before the exam, and 35% of controls reported seeing the guidance.", "takeaway": "Giving students concrete prompts to use AI as a tutor helped more than just encouraging them to use it.", "topic": "ChatGPT & learning", "source": {"citation": "Gallegos, 2026", "url": "https://docs.iza.org/dp18513.pdf", "page": "p. 17"}, "country": "Chile", "year": 2026, "id": "gallegos-chile-2026", "guess": {"prompt": "Which one raised exam grades: the nudge, the how-to guidance, or neither?", "options": ["Being shown how to use it as a tutor", "Neither changed exam grades", "Being nudged to use the AI"], "correct": 0}, "recall": {"prompt": "In the Chilean econometrics trial, what did emails with tutor-style AI prompts do to final exam grades?", "options": ["Grades rose about 3.5 points out of 100", "Grades fell slightly", "No clear change in grades"], "correct": 0, "explain": "Ready-to-copy prompts making the AI a step-by-step tutor raised final exam grades 0.22 standard deviations; simple encouragement to use it showed no clear effect."}, "kind": "A rigorous randomized trial"}, {"hook": "A year with AI tools: what changed for teachers in Lima, and what didn't?", "answer": "Teachers saved no time on core tasks, but they wrote better AI prompts and were better at spotting weak AI output.", "story": "In 390 public schools in Lima, Peru, 1,269 sixth-grade teachers were split by lottery. Half the schools got a one-day workshop, a Microsoft Copilot license and weekly WhatsApp tips for the 2025 school year. By December, treated teachers reported no time saved on seven core tasks. Their prompts were rated better by graders who did not know which group they were in.", "chart": {"type": "bars", "unit": "points gained on a 5-point prompt-quality rubric", "bars": [{"label": "All teachers", "value": 0.375}, {"label": "Teachers over 54", "value": 0.655}, {"label": "Teachers 54 or younger", "value": 0.249}]}, "caption": "Gain in blind-graded prompt quality from the program. Older teachers gained most.", "catch": "It measures teachers' AI skills, not student learning. Fewer than half of teachers answered the final survey. It is a working paper without peer review. World Bank authors ran the program, and Microsoft co-funded the study.", "takeaway": "Training plus Copilot made teachers better AI users, especially older ones, but did not save them time.", "topic": "Teachers & AI", "source": {"citation": "Glave, Lopez, Molina & Zárate, 2026", "url": "https://documents1.worldbank.org/curated/en/099309210012625906/pdf/IDU-c261aadb-6c32-48af-a07c-9cff5e86c716.pdf", "page": "p. 10"}, "country": "Peru", "year": 2026, "id": "lima-docentes-copilot-2026", "guess": {"prompt": "After a year with Copilot and training, what changed for these teachers?", "options": ["They saved time, but their prompts didn't improve", "They saved no time, but wrote better prompts", "They saved time and wrote better prompts"], "correct": 1}, "recall": {"prompt": "In the Lima trial giving sixth-grade teachers Copilot and training, whose AI prompts improved most?", "options": ["No difference by age", "Teachers 54 or younger", "Teachers over 54"], "correct": 2, "explain": "Teachers over 54 gained 0.655 points on the 5-point prompt rubric, versus 0.249 for teachers 54 or younger."}, "kind": "A randomized trial on teachers' skills, not student learning"}, {"hook": "What happened to grades when college courses got a built-in AI tutor?", "answer": "Grades did not rise. They fell 2.88 points out of 100 in the main analysis, though that drop could be chance.", "story": "At the University of Maryland, 30 instructors teaching 2,379 undergraduates were randomly assigned for one 16-week semester. Treated sections added a GPT-4o chatbot built on their course materials. Everyone had ChatGPT and Gemini. Only 14.63% of students with access ever used the tutor, and recorded activity on the course site fell.", "chart": {"type": "effect", "value": -0.285, "low": -0.6, "high": 0.03, "label": "final course grade, full sample"}, "caption": "Final course grade, full sample: -0.285 SD. Significant only at the 10% level, not the usual 5%, so the drop could be chance.", "catch": "Working paper, not peer reviewed. Each instructor gave the grades, so there was no independent test, and nobody knows if AI was allowed on graded work. The university supplying the tutor ran the study.", "takeaway": "Simply offering a course AI tutor did not raise grades here, and most students barely used it.", "topic": "AI tutors", "source": {"citation": "Liu et al., 2026", "url": "https://edworkingpapers.com/sites/default/files/ai26-1598.pdf", "page": "p. 43"}, "country": "United States", "year": 2026, "id": "estados-unidos-maryland-tutor-ia-2026", "guess": {"prompt": "Once courses added a built-in AI tutor, what happened to grades?", "options": ["Grades went up", "No rise: a small drop that could be chance", "Grades fell sharply and clearly"], "correct": 1}, "recall": {"prompt": "In the University of Maryland trial of a GPT-4o course tutor, what share of students with access ever used it?", "options": ["Nearly all of them", "About half of them", "Only 14.63% of them"], "correct": 2, "explain": "Only 14.63% of students with access ever used the tutor, and grades fell 2.88 points out of 100, possibly by chance."}, "kind": "A rigorous randomized trial"}, {"hook": "Can 30 minutes a day on a math app change how Cambodian children score in math?", "answer": "In this trial, yes. Classes that used an adaptive math app scored higher on national and TIMSS math tests after 3 months.", "story": "In five public primary schools near Phnom Penh, 40 classrooms were randomly split. Half used Think!Think!, an adaptive math app in Khmer, about 30 minutes a day in class for 3 months, and the rest had usual lessons. Grade 3 rose 0.77 standard deviations on the national test, grade 4 rose 0.68 on TIMSS, and motivation and self-esteem didn't change.", "chart": {"type": "effect", "value": 0.767, "low": null, "high": null, "label": "Math, grade 3 national test (standard deviations)"}, "caption": "Gain on the grade 3 national math test vs. usual classes, in standard deviations", "catch": "Only 5 schools, the software maker collaborated, and standard errors are unclear. Gains this big in 3 months are unusual, and the authors warn that being observed may have helped. Pre-written content, not generative AI.", "takeaway": "A pre-written adaptive math app raised scores in one short Cambodian trial. Read the size with caution.", "topic": "Adaptive practice", "source": {"citation": "Ito, Kasai, Nishiuchi & Nakamuro, 2021", "url": "https://www.adb.org/sites/default/files/publication/689686/adr-vol38no1-computer-aided-instruction.pdf", "page": "p. 111"}, "country": "Cambodia", "year": 2021, "id": "camboya-think-think-2021", "guess": {"prompt": "After 3 months with the app, what happened to math scores?", "options": ["No real change", "Scores went up clearly", "Scores went down"], "correct": 1}, "recall": {"prompt": "In the Cambodian trial of the Think!Think! math app, what happened to children's motivation and self-esteem?", "options": ["Both went down", "Both went up", "No real change"], "correct": 2, "explain": "Math scores rose, 0.77 standard deviations on the grade 3 national test, but motivation and self-esteem didn't change."}, "kind": "A rigorous randomized trial"}, {"hook": "Can a tablet reading app help second graders in Malawi learn to read in eight months?", "answer": "It pushed their early-literacy scores ahead of classmates', but by the end most still couldn't read a single word of text.", "story": "In two public schools near Lilongwe, 674 second graders were randomly assigned to use a reading app on tablets 40 minutes a day for 8 months, or to regular classes. The app group gained 0.34 standard deviations more in early literacy. Yet average reading fluency at the end was 3.94 words per minute, against a goal of 40.", "chart": {"type": "bars", "unit": "% of children", "bars": [{"label": "Tablet reading group", "value": 77}, {"label": "Regular classes", "value": 84}]}, "caption": "Share still unable to read one word of connected text at the end (the report didn't test this gap)", "catch": "Report by the NGO that promotes the program, not peer reviewed; two hand-picked schools; tablet children got 40% more time on the subject. The app is pre-written, not generative AI.", "takeaway": "Extra daily tablet practice lifted early literacy, but from a very low start most children still weren't reading.", "topic": "Reading", "source": {"citation": "Levesque, Bardack & Chigeda, 2020", "url": "https://www.imagineworldwide.org/wp-content/uploads/An-8-month-RTC-in-Malawi_Final-Report_Jan-2020.pdf", "page": "p. 31"}, "country": "Malawi", "year": 2020, "id": "lectura-onecourse-levesque-2020", "guess": {"prompt": "After 8 months on the app, how did the tablet group's reading turn out?", "options": ["Scores rose, but most still couldn't read a word", "No real difference from regular classes", "Scores rose, and most children were reading text"], "correct": 0}, "recall": {"prompt": "In the Malawi trial of a tablet reading app for second graders, what was average reading fluency at the end?", "options": ["About 4 words per minute", "About 20 words per minute", "About 40 words per minute, meeting the goal"], "correct": 0, "explain": "App-group children averaged 3.94 words per minute after 8 months, far below the goal of 40 for second grade."}, "kind": "A rigorous randomized trial"}, {"hook": "Same 4 minutes of math drills a day: does it matter if kids do them all at once?", "answer": "Yes. Third graders who spread their drills across the day grew faster in addition fluency than those who did them back to back.", "story": "In one US public elementary school, 48 third graders did four 1-minute timed addition drills a day for 19 school days. One group did all four at 9:00, while others split them into two or four times a day, with the same 76 minutes in total. Both spaced groups improved faster than the back-to-back group.", "chart": {"type": "bars", "unit": "digits correct per minute gained", "bars": [{"label": "All at once", "value": 10}, {"label": "Twice a day", "value": 15}, {"label": "Four times a day", "value": 18}]}, "caption": "Gain in addition fluency over 76 minutes of practice, by how the drills were spread out", "catch": "Small groups (15 to 18 students) in one school. The tests were researcher-made sheets like the practice itself. At the final test, only the four-times-a-day gap was clearly beyond chance.", "takeaway": "For quick math-fact drills, spreading the same practice across the school day helped kids gain fluency faster.", "topic": "Learning science", "source": {"citation": "Schutte et al., 2015", "url": "https://doi.org/10.1016/j.jsp.2014.12.003", "page": "p. 8"}, "country": "United States", "year": 2015, "id": "estados-unidos-practica-distribuida-fluidez-matematica-2015", "guess": {"prompt": "Same drills, same total time: what happened when kids spread them out?", "options": ["They gained fluency faster", "No real difference", "They gained fluency more slowly"], "correct": 0}, "recall": {"prompt": "In the US third-grade addition drill study, how did the four-times-a-day group compare to doing drills all at once?", "options": ["It gained about the same", "It gained more: 18 vs. 10 digits per minute", "It gained less than all at once"], "correct": 1, "explain": "Over the same 76 minutes, the four-times-a-day group gained 18 digits correct per minute, versus 10 for all at once."}, "kind": "A randomized trial, with limits"}, {"hook": "Where did 'we remember 10% of what we read, 90% of what we do' come from?", "answer": "Not from research: versions circulated from 1852, before memory experiments, and the numbers never matched.", "story": "Two researchers searched digitized books and journals in Google Books and HathiTrust up to 1940 for versions of the 'learning pyramid.' They found number-free versions from 1852 and 63 versions published between 1906 and 1940, with fractions or percentages that disagree. The neat 10% steps seem to come from converting fractions into tenths.", "chart": {"type": "bars", "unit": "peer-reviewed articles", "bars": [{"label": "Repeat the pyramid", "value": 418}, {"label": "Question it", "value": 15}]}, "caption": "Peer-reviewed articles 1990–2013 repeating the pyramid vs. questioning it (authors' 2016 study)", "catch": "A historical search, not an experiment. Proving a study doesn't exist is hard, and only digitized texts up to 1940 were searched. It doesn't claim reading works as well as doing.", "takeaway": "The pyramid's percentages come from no study; don't use them to plan teaching.", "topic": "Myths", "source": {"citation": "Letrud & Hernes, 2018", "url": "https://doi.org/10.1080/2331186X.2018.1518638", "page": "p. 4"}, "country": "Norway", "year": 2018, "id": "piramide-letrud-2018", "guess": {"prompt": "Where do you think the 'learning pyramid' percentages came from?", "options": ["From a review of many retention studies", "Not from research: versions circulated from 1852", "From a classic memory experiment"], "correct": 1}, "recall": {"prompt": "In the Norwegian historical search for the origins of the 'learning pyramid', what did the researchers find?", "options": ["A 1906 experiment that first measured the 10% steps", "Versions from 1852 and 63 later ones with clashing numbers", "Every old version gave the same percentages"], "correct": 1, "explain": "Versions circulated from 1852, before memory experiments; 63 versions from 1906–1940 gave disagreeing numbers, and the neat 10% steps likely came from converting fractions."}, "kind": "A historical review"}, {"hook": "When a school bans phones, what changes for its teenagers, and what doesn't?", "answer": "Less phone time during school, but no better wellbeing, sleep, behaviour or grades than in schools that allow phones.", "story": "Researchers surveyed 1227 students aged 12 to 15 in 30 English state secondary schools: 20 restricted phones all day, 10 allowed them at breaks or anytime. Students in restrictive schools reported 0.67 hours less phone use during school. Yet their mental wellbeing scores and total daily phone use were about the same.", "chart": {"type": "effect", "value": -0.05, "low": -0.23, "high": 0.12, "label": "Mental wellbeing, ban schools vs. schools allowing phones"}, "caption": "Wellbeing gap of -0.05 standard deviations: close to zero, and could be chance", "catch": "A single snapshot, not an experiment: schools set their own rules, few invited schools took part, and phone hours were self-reported. In 16 of 20 'ban' schools, phones just stayed switched off in bags.", "takeaway": "Students in phone-ban schools reported less in-school phone use, but no better wellbeing or grades.", "topic": "Screens & phones", "source": {"citation": "Goodyear et al., 2025", "url": "https://pmc-oa-opendata.s3.amazonaws.com/PMC11984610.1/PMC11984610.1.pdf", "page": "p. 9"}, "country": "United Kingdom", "year": 2025, "id": "celulares-goodyear-2025", "guess": {"prompt": "Compared with schools allowing phones, how was teens' wellbeing in ban schools?", "options": ["About the same wellbeing", "Clearly worse wellbeing", "Clearly better wellbeing"], "correct": 0}, "recall": {"prompt": "In the study of 30 English schools with and without phone bans, what was different for teens in ban schools?", "options": ["Less phone use during school", "Better mental wellbeing", "Higher English and maths grades"], "correct": 0, "explain": "Ban-school students reported 0.67 hours less phone use in school, but wellbeing, grades and total phone use were about the same."}, "kind": "A survey snapshot: a pattern, not cause and effect"}, {"hook": "If an AI rewrites your draft for you, can you still learn to write better?", "answer": "In short online experiments, yes: adults who practiced with an AI rewriter later wrote better without AI than those who practiced alone.", "story": "In the main experiment, 2238 US adults recruited online got a short lesson on five writing principles, then rewrote one cover letter: with an AI tool that returned a polished version, alone, or not at all. On a 7-minute test without AI, the AI group scored 5.01 out of 10 versus 4.53 for those who practiced alone.", "chart": {"type": "bars", "unit": "average writing score (0–10)", "bars": [{"label": "Practiced with AI", "value": 5.01}, {"label": "Practiced alone", "value": 4.53}]}, "caption": "Average score on a no-AI writing test right after practice, graded by GPT-4o (0–10)", "catch": "Not peer reviewed; one brief online session with an artificial task. The authors built the tool, and GPT-4o graded on the same principles the tool used. Human judges saw a smaller edge.", "takeaway": "Seeing AI rewrite your draft can teach a writing style, at least for a short task right afterward.", "topic": "ChatGPT & learning", "source": {"citation": "Lira, Rogers, Goldstein, Ungar & Duckworth, 2026", "url": "https://arxiv.org/pdf/2502.02880v4", "page": "p. 17"}, "country": "United States", "year": 2026, "id": "eeuu-escritura-coach-ia-2026", "guess": {"prompt": "After practicing with an AI rewriter, how did people write on their own?", "options": ["Better than those who practiced alone", "Worse than those who practiced alone", "About the same as those who practiced alone"], "correct": 0}, "recall": {"prompt": "In the US online study where adults rewrote a cover letter, how did AI practicers do on the later no-AI test?", "options": ["No difference from practicing alone", "Lower than practicing alone: 4.53 vs 5.01 of 10", "Higher than practicing alone: 5.01 vs 4.53 of 10"], "correct": 2, "explain": "Adults who practiced with the AI rewriter scored 5.01 out of 10 without AI, versus 4.53 for those who practiced alone."}, "kind": "A rigorous randomized experiment, in a lab session"}, {"hook": "Remembering a baseball story: does reading skill matter more, or knowing baseball?", "answer": "Knowing baseball helped on every memory and summary measure, for strong and weak readers alike.", "story": "In the US, 64 seventh and eighth graders, sorted into four groups by reading ability and baseball knowledge, silently read an account of half an inning of a baseball game. Then they rebuilt it with figures, retold it, summarized it and ranked its sentences. Those who knew baseball did better on every measure, whether they were good or poor readers.", "chart": {"type": "bars", "unit": "students", "bars": [{"label": "Good readers, know baseball", "value": 16}, {"label": "Good readers, don't know baseball", "value": 16}, {"label": "Poor readers, know baseball", "value": 16}, {"label": "Poor readers, don't know baseball", "value": 16}]}, "caption": "How the 64 students were grouped. The record gives no group scores to chart.", "catch": "Based only on the abstract: no scores or effect sizes could be checked, including the popular claim that poor readers who knew baseball beat good readers who didn't. Not randomized; 16 per group.", "takeaway": "Knowing the topic helped students remember and summarize a text, for good and poor readers alike.", "topic": "Reading", "source": {"citation": "Recht & Leslie, 1988", "url": "https://doi.org/10.1037/0022-0663.80.1.16", "page": "p. 1"}, "country": "United States", "year": 1988, "id": "lectura-recht-1988", "guess": {"prompt": "Which made the bigger difference in remembering the baseball story?", "options": ["Knowing baseball, for good and poor readers alike", "Neither made a clear difference", "Reading skill; topic knowledge added little"], "correct": 0}, "recall": {"prompt": "In the 1988 US study where 64 seventh and eighth graders read a baseball story, what did knowing baseball do?", "options": ["It helped only the poor readers", "It helped on every measure, for good and poor readers", "It made no clear difference"], "correct": 1, "explain": "Students who knew baseball did better on every memory and summary measure, whether they were good or poor readers."}, "kind": "An observational study: a pattern, not cause and effect"}, {"hook": "What happens when a computer gives students instant feedback on practice essays?", "answer": "Their exam essay scores rose a little, and adding paid human graders on top made no extra difference.", "story": "In 2019, 178 public high schools in Espírito Santo, Brazil, with about 19,000 seniors, were randomly assigned to an essay platform with instant automatic feedback, the same platform plus human graders, or nothing. After five practice essays over the year, both platform groups scored 0.094 standard deviations higher on the national entrance-exam essay.", "chart": {"type": "effect", "value": 0.094, "low": null, "high": null, "label": "ENEM essay total score, AI-only version vs. schools without the platform"}, "caption": "Essay score gain, AI-only version: a moderate effect, average student from 50th to 54th of 100", "catch": "Not generative AI: feedback was picked from prewritten comments. Working paper, not peer reviewed. Gains appeared only on the practiced exam essay, not narrative writing or other subjects. The company helped design the trial.", "takeaway": "Automatic feedback on practice essays modestly lifted exam essay scores. Paying human graders on top added nothing.", "topic": "Teachers & AI", "source": {"citation": "Ferman, Lima & Riva, 2021", "url": "https://www.povertyactionlab.org/sites/default/files/research-paper/working-paper_5806_Artificial-Intelligence-Teacher-Tasks-Pedagogy_Brazil_Feb2021.pdf", "page": "p. 35"}, "country": "Brazil", "year": 2021, "id": "brasil-letrus-awe-2021", "guess": {"prompt": "What happened to their exam essay scores?", "options": ["They went down", "They rose a little", "No real change"], "correct": 1}, "recall": {"prompt": "In the Brazil trial of instant computer feedback on practice essays, what did adding paid human graders do?", "options": ["Doubled the score gain", "Erased the score gain", "Made no extra difference"], "correct": 2, "explain": "Both platform versions raised exam essay scores by 0.094 standard deviations, so human graders on top added nothing."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens when rural schools hand kids math practice software and most barely use it?", "answer": "Offering the software made no clear difference to math scores. Only the most active 20% of users scored higher.", "story": "In 95 schools in poor rural areas of Taiwan, 1,840 fourth and fifth graders took part in a trial. Schools were randomly assigned either math practice software for ten weeks in spring 2019 or nothing. Overall, math scores came out about the same. The most active 20% of users scored higher, but who used it most wasn't random.", "chart": {"type": "effect", "value": 0.015, "low": -0.1, "high": 0.13, "label": "Math score at end of semester, schools offered the software vs. schools without it"}, "caption": "Effect of offering the software on math, in standard deviations: about zero, with 95% range", "catch": "This is pre-generative AI: prewritten practice software, not a chatbot. The researchers ran the program, more treatment students dropped out, and the top-user gain compares students who chose to use it more.", "takeaway": "Offering math practice software didn't raise scores overall. Higher scores appeared only among the heaviest users.", "topic": "Adaptive practice", "source": {"citation": "Ma et al., 2024", "url": "https://doi.org/10.1080/19345747.2023.2279167", "page": "p. 1056"}, "country": "Taiwan", "year": 2024, "id": "taiwan-cal-rural-2024", "guess": {"prompt": "Schools were offered math practice software. What happened to math scores overall?", "options": ["No clear difference", "Scores went down", "Scores clearly went up"], "correct": 0}, "recall": {"prompt": "In the rural Taiwan trial of math practice software for fourth and fifth graders, which students scored higher?", "options": ["Students who used it the least", "All students offered the software", "Only the most active 20% of users"], "correct": 2, "explain": "Offering the software made no clear difference overall; only the most active 20% scored higher, and who used it most wasn't random."}, "kind": "A rigorous randomized trial"}, {"hook": "What happens to exam scores when teenagers let a chatbot help with their homework?", "answer": "Homework grades went up, but scores on closed-book monthly exams fell 20% below students' earlier average.", "story": "Researchers followed 26,811 secondary students in one county in central China for 30 months as they began using chatbots like Doubao and DeepSeek on their own. Six months after starting, homework scores were up 18% and assignments took 45 minutes instead of 64. Monthly exam scores were down 20%, compared with students who hadn't started yet.", "chart": {"type": "bars", "unit": "% change vs. students' earlier average", "bars": [{"label": "Homework scores", "value": 18}, {"label": "Monthly closed-book exams", "value": -20}]}, "caption": "Change in scores after six months of chatbot use, as a % of stud
